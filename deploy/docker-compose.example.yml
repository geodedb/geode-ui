# Example docker-compose for running geode-ui alongside a Geode database.
#
# Build context note:
#   The geode-ui Dockerfile expects the parent directory of geode-ui as its
#   build context (see deploy/Dockerfile header), so the build context here
#   is `..` and you must run docker-compose from a layout like:
#
#     parent/
#       geode-ui/             ← this repo (compose lives in deploy/)
#
#   With that layout, run:
#     cd parent
#     docker compose -f geode-ui/deploy/docker-compose.example.yml up --build
#
#   Or copy this file out of deploy/ to the parent directory.

version: '3.8'
services:
  geode:
    # Replace with the real Geode image when available; placeholder for local dev.
    image: ghcr.io/geodedb/geode:latest
    ports:
    - 3141:3141
    volumes:
    - geode-data:/data
    command: [serve, --data-dir, /data, --listen, 0.0.0.0:3141]

  geode-ui:
    build:
      # Parent of geode-ui (so geode-client-go is a sibling in the context).
      context: ../..
      dockerfile: geode-ui/deploy/Dockerfile
    depends_on:
    - geode
    ports:
    - 8080:8080
    environment:
      # Generate with: openssl rand -hex 32
      JWT_SECRET_HEX: REPLACE_WITH_OPENSSL_RAND_HEX_32
      # GAP-S5 (#118): required for at-rest encryption of DSN and TLS
      # PEM material in the SQLite profile store. Generate with:
      #   openssl rand -base64 32
      # Loss of this key permanently locks any rows it encrypted out of
      # decryption — store it in a secret manager (k8s Secret, Docker
      # secret, etc.), not in version control.
      GEODE_PROFILESTORE_KEY: REPLACE_WITH_OPENSSL_RAND_BASE64_32
    # `-secure-cookies` defaults to true so the auth cookie carries the
    # Secure flag (HTTPS-only). Set it to false in environments that serve
    # geode-ui over plain HTTP, otherwise the browser will refuse to
    # attach the cookie on subsequent requests.
    command: [-listen, :8080, -jwt-secret-hex, '${JWT_SECRET_HEX}', -profiles, /etc/geode-ui/profiles.json, -upload-dir, /var/lib/geode-ui/uploads]
    volumes:
    - ./profiles.json:/etc/geode-ui/profiles.json:ro
    - geode-ui-uploads:/var/lib/geode-ui/uploads

volumes:
  geode-data:
  geode-ui-uploads:
