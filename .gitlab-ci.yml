---
# GitLab CI/CD Pipeline for ui
# SPDX-License-Identifier: Apache-2.0

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.7.1

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.7.1

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.7.1

  # Code signing — Windows Authenticode via ssl.com eSigner.
  # Pulls credentials from group-level CI variables ESIGNER_*; see
  # deploy/RELEASE.md for the one-time ssl.com setup.
  #
  # TODO(#127): pin to an immutable tag. As of 2026-05, the
  # `codesign-windows-ssl` component exists only on ci-catalog's
  # `main` branch (commit db708c0, "feat(catalog): add
  # codesign-windows-ssl component") — it has NOT shipped in any
  # tagged release yet (latest catalog tag is v1.25.1, which predates
  # it; the `~latest` *release* alias resolves to v1.19.2). Every
  # other catalog component below is pinned to @v1.7.1. The moment a
  # ci-catalog tag includes templates/codesign-windows-ssl/, bump
  # this to that tag. `scripts/check-ci-pins.sh` allowlists THIS one
  # `@~latest` by line content so the guard still catches any *new*
  # `@latest`/`@~latest` regression.
  - component: gitlab.com/devnw/ci-catalog/codesign-windows-ssl@~latest # ci-pins-allow: no tagged catalog release ships this component yet (see TODO #127)
    inputs:
      input_glob: 'release/win/*.exe'
      needs: 'electron:win'
      tag_only: true
      job_name: 'codesign:electron-win'
      stage: release
      allow_failure: true

  # APT repository publishing (apt.geodedb.com)
  #
  # Mirrors the sibling ../geode CI's apt-publish wiring (see
  # ../geode/.gitlab-ci.yml:34-45). Both projects publish .deb
  # artifacts to the same apt repo at apt.geodedb.com — they MUST
  # share vault_secret_path + gpg_key_name because the repo carries
  # a single detached signature; mixing keys invalidates the repo
  # for either set of packages.
  #
  # Vault access is already provisioned: the `codepros-ci` JWT role
  # at devnw/infra/vault/gitlab_ci_roles.tf:223-252 binds to
  # `namespace_path = "devnw,devnw/*"` with `bound_claims_type =
  # "glob"`, so any project under devnw/* (including this one at
  # devnw/codepros/geode/geode-ui) can authenticate. The
  # `gitlab-ci-apt-repos` policy (line 181) already grants read on
  # devnw/data/geode/* — covering the geode/apt path used here. No
  # infra change required; allow_failure stays at false so a publish
  # failure blocks the deploy gate.
  - component: gitlab.com/devnw/ci-catalog/apt-publish@v1.25.2
    inputs:
      apt_domain: apt.geodedb.com
      job_suffix: apt-geodedb-com
      vault_auth_role: codepros-ci
      vault_mount: devnw
      vault_secret_path: geode/apt
      package_path: dist/*.deb
      gpg_key_name: geode.gpg
      sign_needs: goreleaser-release
      allow_failure: false

variables:
  NODE_VERSION: '22.14.0'
  GO_VERSION: '1.26-alpine'
  GORELEASER_VERSION: 'v2.13.3'
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  FF_USE_FASTZIP: 'true'
  ARTIFACT_COMPRESSION_LEVEL: 'fast'
  CACHE_COMPRESSION_LEVEL: 'fast'
  # Docker Hub credentials (set as protected CI variables in GitLab):
  #   DOCKERHUB_USERNAME — Docker Hub login (e.g., "geodedb")
  #   DOCKERHUB_TOKEN    — Docker Hub access token (NOT a password)
  # When unset, goreleaser exports SKIP_DOCKERHUB=true and the dockerhub
  # image variants are built locally but not pushed.

default:
  # image-pin: 2026-05-16 @ NODE_VERSION (top of file) controls the
  # base tag; refresh on the same cadence as deploy/Dockerfile node
  # stage. QUALITY #233 / scripts/check-image-pins.sh enforces cadence.
  image: node:${NODE_VERSION}
  before_script:
    # Configure GitLab npm registry for @devnw scope
    - |
      echo "@devnw:registry=https://gitlab.com/api/v4/packages/npm/" >> ~/.npmrc
      echo "//gitlab.com/api/v4/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> ~/.npmrc
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull
  # `linux` constrains job picking to the linux runner pool — without
  # it, the company-tag also matches the Windows runner (which lacks
  # `npm` on PATH and would fail every node-based job). electron:mac
  # and electron:win opt into their platform pools explicitly via
  # their own tags.
  tags:
    - company
    - linux

stages:
  - install
  - lint
  - test
  - build
  - pages
  - security
  - sbom
  - release
  - publish

# ============================================================================
# INSTALL STAGE
# ============================================================================

install:
  stage: install
  script:
    - npm ci
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/
      # `packages/ui-core/dist/` is built during `npm ci` by the
      # workspace package's `prepare` script. Caching it alongside
      # node_modules means a warm CI run skips the ~3s tsup rebuild.
      - packages/ui-core/dist/
    policy: pull-push
  artifacts:
    paths:
      - node_modules/
      # Downstream jobs (build, goreleaser-release, electron:*) import
      # `@geodedb/ui-core/theme`, which resolves via the package's
      # `exports` field to packages/ui-core/dist/*.js + .d.ts. The
      # `prepare` script in packages/ui-core/package.json materialises
      # dist/ during `npm ci`; archiving it here propagates the
      # output so downstream webpack/typecheck see the Theme type
      # augmentation (without this, 750+ TS2339 errors on
      # `theme.{spacing,zIndex,bg,…}` accessors).
      - packages/ui-core/dist/
    expire_in: 1 hour

# ============================================================================
# LINT STAGE
# ============================================================================

typecheck:
  stage: lint
  needs: ['install']
  # QUALITY #228: `npm run test:ts` typechecks the SPA tree, the e2e
  # specs, AND the support scripts in one pass (see package.json:14-16
  # for the three composed projects). A regression in any of the three
  # fails the gate.
  script:
    - npm run test:ts
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

eslint:
  stage: lint
  needs: ['install']
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

prettier:
  stage: lint
  needs: ['install']
  script:
    - npm run prettier:check
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Closes GAP-008: the four ratchet gates land in CI alongside the
# existing pre-commit hooks. Local pre-commit + remote CI agree on
# the same enforcement contract, so a contributor who skips the
# pre-commit hook still blocks at MR time.
audit-ratchets:
  stage: lint
  needs: ['install']
  script:
    - npm run lint:hardcoded-styles
    - npm run lint:contrast
    - npm run verify:translations
    - npm run detect:hardcoded-strings
    # GAP-034 (#273): mirror the doc-routes + changelog + security-md
    # gates that ran locally via .pre-commit-config.yaml:224,235.
    # Without this mirror a contributor who skips pre-commit can land
    # a stale CHANGELOG.md or a doc-route regression on main with no
    # CI signal — the same hole closed for the four ratchets above.
    - npm run check:doc-routes
    - npm run check:changelog
    - npm run check:security-md
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Closes GAP-009 / Q25 (#170): type-check the Electron main + preload
# independently from the SPA tsc pass. The renderer tsconfig
# (tsconfig.json) does not include electron/ — without this job, a
# regression in electron/main.ts or electron/preload.ts would land
# silently and only surface during a release-engineer's
# `npm run electron:package` run. `electron` and `@types/node` are now in
# devDependencies (so `npm run electron:tsc` resolves the `electron`
# module + `node` lib types), the electron sources type-check cleanly,
# and the job is a real gate — no longer allow_failure.
electron-typecheck:
  stage: lint
  needs: ['install']
  script:
    - npm run electron:tsc
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - electron/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Supply-chain pin guard (Q32 / #127, SEC F-SUP-3 / #153). The
# pre-commit hook of the same name runs locally; this job mirrors it at
# MR time so a contributor who skipped pre-commit still blocks here.
ci-pins-check:
  stage: lint
  needs: []
  # image-pin: 2026-05-16 @ alpine:3 floating major tag — refresh per cadence.
  image: alpine:3
  before_script: []
  cache: []
  script:
    - apk add --no-cache bash grep
    - bash scripts/check-ci-pins.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# QUALITY #233: image-pin staleness gate. Walks .gitlab-ci.yml and
# deploy/Dockerfile* looking for the
# `# image-pin: <YYYY-MM-DD> @ <reason>` marker we use to date every
# container/CI image reference, and warns when a pin is older than
# 60 days (refresh cadence the team agreed to). Fails loudly if an
# image reference carries no pin comment at all.
image-pins-check:
  stage: lint
  needs: []
  # image-pin: 2026-05-16 @ alpine:3 floating major tag — refresh per cadence.
  image: alpine:3
  before_script: []
  cache: []
  script:
    - apk add --no-cache bash grep
    - bash scripts/check-image-pins.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Error-code seam guard. The pre-commit hook of the same name runs
# locally; this job mirrors it at MR time so a contributor who skipped
# pre-commit still blocks here if src/api/serverErrorCodes.ts names a
# code that internal/server/errorcodes.go no longer declares.
error-codes-check:
  stage: lint
  needs: []
  # image-pin: 2026-05-16 @ alpine:3 floating major tag — refresh per cadence.
  image: alpine:3
  before_script: []
  cache: []
  script:
    - apk add --no-cache nodejs
    - node --test scripts/check-error-codes.test.mjs
    - node scripts/check-error-codes.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# TEST STAGE
# ============================================================================

unit-tests:
  stage: test
  needs: ['install']
  script:
    - npm test -- --coverage --ci
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    paths:
      - coverage/
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# BUILD STAGE
# ============================================================================

build:
  stage: build
  needs:
    - job: install
    # The validator jobs (eslint, typecheck, unit-tests, audit-ratchets)
    # only run on MR + default-branch pipelines (their rules exclude
    # tags). The build job DOES run on tags (rules include
    # $CI_COMMIT_TAG below), so we'd otherwise fail config validation
    # with "X does not exist in the pipeline". `optional: true` makes
    # the dependency a no-op when the upstream job is absent — fine
    # for tag pipelines because main was already green when the tag
    # was cut from it.
    - job: eslint
      optional: true
    - job: typecheck
      optional: true
    - job: unit-tests
      optional: true
    - job: audit-ratchets
      optional: true
  script:
    - npm run build
  # QUALITY rank 2 / #226: webpack emits `internal/ui/dist`
  # (webpack.common.js:123). The artifact path MUST point at the same
  # directory or the `pages` job downstream finds an empty tree and
  # silently publishes a 404 site.
  artifacts:
    paths:
      - internal/ui/dist/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# PERF-N6 (#285): chunk-budget tripwire. Walks internal/ui/dist after
# the build and fails if any single .js chunk exceeds the configured
# budget. Starts at allow_failure: true so the first regression
# surfaces as a warning rather than a pipeline failure; flip to
# false once the budget has been tuned against the slow-device
# baseline. Override the budget via the `BUDGET` env var.
chunk-budget:
  stage: build
  needs:
    - job: install
    - job: build
      artifacts: true
  # image-pin: 2026-05-17 @ same NODE_VERSION as the install job.
  # The chunk-budget script is pure Node stdlib + readdirSync so it
  # needs no additional deps; the node_modules artifact is implied
  # by `needs: [install]`.
  image: node:${NODE_VERSION}
  script:
    - node scripts/check-chunk-budget.mjs ${BUDGET:+--budget $BUDGET}
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# PAGES STAGE - Deploy to GitLab Pages
# ============================================================================

pages:
  stage: pages
  needs:
    - job: build
      artifacts: true
    - job: build-storybook
      artifacts: true
  before_script: []
  # QUALITY rank 2 / #226: consume the `build` artifact at its actual
  # emit location, then rename to `public` (GitLab Pages contract).
  # The Storybook static site (from build-storybook) is nested under
  # public/storybook/ so both the SPA and the component docs are served
  # from the same Pages deployment.
  script:
    - mv internal/ui/dist public
    - mkdir -p public/storybook
    - cp -r packages/ui-core/storybook-static/. public/storybook/
    - echo "Publishing SPA + Storybook to GitLab Pages"
    - ls public/ | head -5
  artifacts:
    paths:
      - public
  environment:
    name: production
    url: $CI_PAGES_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# GO PIPELINE
# ============================================================================
#
# These jobs cover the Go side of the project (backend API server, generated
# code, and the multi-stage Docker image). They reuse the existing
# install/lint/test/build stages declared above.

.go_defaults: &go_defaults
  # image-pin: 2026-05-16 @ golang:1.26-alpine; bump in lockstep with
  # go.mod toolchain. Shared across go:lint, go:test, go:bench-gate.
  image: golang:1.26-alpine
  variables:
    GOEXPERIMENT: jsonv2
    GOTOOLCHAIN: go1.26.3
    CGO_ENABLED: "0"
    # QUALITY #175: stash the module download cache so the test/lint
    # jobs don't pull every dep from proxy.golang.org on every pipeline.
    # GOMODCACHE points at a workspace-relative path so GitLab's cache
    # mechanism can archive + restore the directory across jobs.
    GOMODCACHE: $CI_PROJECT_DIR/.go-mod-cache
    GOCACHE: $CI_PROJECT_DIR/.go-build-cache
  before_script: []
  cache:
    # QUALITY #175: cache key bound to `go.sum` so a dependency change
    # invalidates the cache (otherwise we'd reuse a stale module set
    # that doesn't match the lockfile). The build cache rides along
    # because it's keyed on the same input set and tracks together.
    key:
      files:
        - go.sum
      prefix: go-cache-v1
    paths:
      - .go-mod-cache
      - .go-build-cache
    policy: pull-push

go:lint:
  <<: *go_defaults
  stage: lint
  script:
    - apk add --no-cache git make
    # Pinned to an immutable tag (Q32 / #127). Bump deliberately; keep in
    # sync with the version local devs run (see CLAUDE.md / scripts).
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
    - golangci-lint run
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

go:generate-verify:
  <<: *go_defaults
  stage: lint
  script:
    - apk add --no-cache make git nodejs npm
    - npm ci
    # Pinned to an immutable tag (Q32 / #127). Bump in lockstep with the
    # genapi version the gen/ tree was generated against. NOTE: this pin
    # does not change the fetch auth path — CI's Go jobs run with
    # `before_script: []` and no visible GOPRIVATE/.netrc, so genapi must
    # already be go-gettable by the runner (it was being fetched at
    # @latest before); runner-side module-proxy/auth for devnw.dev/genapi
    # is a separate, pre-existing concern.
    - go install devnw.dev/genapi/cmd/genapi@v0.3.3
    - make generate
    - git diff --exit-code -- gen/ || (echo "make generate produced changes — commit them"; exit 1)
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

go:test:
  <<: *go_defaults
  # Must run AFTER `build` so the //go:embed sees the SPA dist artifact.
  # Same stage as `build` is OK — GitLab evaluates intra-stage `needs:`
  # as a DAG.
  stage: build
  # QUALITY #229: reuse the SPA bundle the `build` job already produced
  # instead of re-running `npm ci` + `npm run build` here (a ~99s
  # webpack rebuild on every pipeline). The build job archives
  # `internal/ui/dist/` for 7 days; we pull it in via `needs.artifacts`
  # and the Go embed sees the prebuilt dist directly. Keeps the
  # double-install / double-build cost out of CI.
  needs:
    - job: build
      artifacts: true
  script:
    - apk add --no-cache git make
    # Sanity: the build artifact must be present at the embed path the
    # Go server's `//go:embed internal/ui/dist` directive expects.
    - test -f internal/ui/dist/index.html
    # QUALITY #174: scope Go enumeration to project-owned trees so
    # `./...` doesn't walk into `node_modules/flatted/golang/`.
    - go test -race -cover -failfast ./cmd/... ./gen/... ./internal/...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Performance regression gate (PERF-2026-05-11-11 / #156).
#
# Runs `make bench-gate`, which executes the curated benchmark set
# (scripts/bench-gate.sh — internal/conn, internal/server, internal/jwt,
# gen/pkg/{wsx,oidcx,securex,gen}) with `-count=6` and a bounded `-benchtime`,
# then diffs the result against the committed `bench-baseline.txt` via
# `benchstat`. The job fails if any benchmark regressed > 10% in ns/op, B/op,
# or allocs/op with a statistically significant delta.
#
# Promoted to a real gate (PERF-2026-05-21-01, 2026-05-21 audit):
# `allow_failure: false`. The high -count + benchstat's significance
# test plus the >10% threshold suppress runner noise; the audit's
# meta-blocker was that with `allow_failure: true` every confidence::
# suspected perf finding stayed invisible to MR review. Five hot-path
# benchmarks were added in lockstep (ParseProm, ProjectSnapshot,
# HandleMetrics, LspFrameReader_ReadFrame, HIBPHasSeen) so the gate
# now covers the previously-uncovered metrics-poll and LSP/HIBP
# paths. After a deliberate, accepted perf change, regenerate the
# baseline with `make bench-baseline` and commit `bench-baseline.txt`.
# See docs/ARCHITECTURE.md ("Performance SLOs").
bench-gate:
  <<: *go_defaults
  # Same stage as `go:test` (which moved to `build` so its //go:embed
  # sees the SPA dist). The intra-stage needs: edge orders bench AFTER
  # go:test passes.
  stage: build
  needs: ['go:test']
  script:
    - apk add --no-cache git make bash
    # Pinned to an immutable pseudo-version (Q32 / #127); x/perf has no
    # semver tags, so this is the latest tagged commit of cmd/benchstat.
    - go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260409210113-8e83ce0f7b1c
    - export PATH="$(go env GOPATH)/bin:$PATH"
    - make bench-gate
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Builds the multi-stage Dockerfile in deploy/. The Dockerfile expects a
# sibling geode-client-go/ checkout next to the geode-ui/ context root (see
# deploy/Dockerfile header). For CI, fetch the sibling repo into a temporary
# parent dir so docker build sees the expected layout.
docker:build:
  stage: build
  # image-pin: 2026-05-16 @ docker:25 + docker:25-dind (matched pair);
  # refresh per cadence.
  image: docker:25
  services:
    - docker:25-dind
  before_script: []
  variables:
    DOCKER_TLS_CERTDIR: ""
    # Without DOCKER_HOST the client tries `unix:///var/run/docker.sock`
    # which dind doesn't expose. The k8s runner publishes the dind
    # service at the `docker` hostname on TCP 2375 (TLS off because
    # DOCKER_TLS_CERTDIR=""). v0.1.9 docker:build failed with
    # "Cannot connect to the Docker daemon at unix:///var/run/docker.sock".
    DOCKER_HOST: tcp://docker:2375
  script:
    - apk add --no-cache git
    # Wait up to 60s for the dind service to bind on tcp://docker:2375.
    # Same pattern as .goreleaser-base above; docker:build was failing
    # intermittently on tag pipelines because the daemon-readiness gate
    # wasn't present (v0.1.6/7/8 happened to win the race; v0.1.9 lost).
    - |
      for i in $(seq 1 60); do
        if docker info >/dev/null 2>&1; then break; fi
        sleep 1
      done
      docker info
    - mkdir -p /tmp/ctx/geode-ui
    - cp -r . /tmp/ctx/geode-ui/
    - git clone --depth=1 https://gitlab.com/devnw/geode/geode-client-go.git /tmp/ctx/geode-client-go || echo "geode-client-go clone failed; document a private mirror token if needed"
    - cd /tmp/ctx
    - docker build -f geode-ui/deploy/Dockerfile -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA; fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================================================
# E2E STAGE - Playwright suite against the full docker-compose stack
# ============================================================================
#
# Runs the e2e Playwright suite against the docker-compose.test.yml stack.
# The stack expects a pre-built geode binary at ../geode/zig-out/bin/geode
# (see deploy/geode/Dockerfile.geode). In CI we clone the geode repo at the
# pinned tag and run `zig build` before invoking `make e2e-up`. This requires
# Zig 0.16.0+ on the runner (installed inline below). If the geode repo
# becomes inaccessible from CI, switch this job to `when: manual` and rely
# on local `make e2e-ci` runs until the geode runtime ships as a binary
# release artifact.
e2e:playwright:
  stage: test
  # image-pin: 2026-05-16 @ docker:25 + docker:25-dind; refresh per cadence.
  image: docker:25
  services:
    - docker:25-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    GEODE_ADMIN_PASSWORD: "Geode E2E Bootstrap Password 2024"
    JWT_SECRET_HEX: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" # pragma: allowlist secret
    ZIG_VERSION: "0.16.0"
  script:
    - apk add --no-cache make git bash curl xz tar
    # Install Zig so the geode binary can be built on the host.
    - curl -sSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
    - mkdir -p /opt/zig && tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
    - export PATH="/opt/zig:$PATH"
    - zig version
    # Fetch the geode runtime sources at the pinned tag and build the binary.
    - git clone --depth=1 --branch v0.5.11 https://gitlab.com/devnw/codepros/geode/geode.git ../geode || git clone --depth=1 --branch v0.5.11 https://gitlab.com/devnw/geode/geode.git ../geode
    - (cd ../geode && zig build -Doptimize=ReleaseSafe)
    # Build the e2e stack and bring services up.
    - make e2e-up
    # Wait for geode-ui to be ready.
    - |
      for i in $(seq 1 90); do
        if wget -qO- http://docker:8080/healthz 2>/dev/null | grep -q ok; then
          echo "geode-ui is healthy"
          break
        fi
        sleep 2
      done
    # Build the playwright runner and run the suite. Mount the report dir.
    - docker build -f deploy/playwright/Dockerfile.playwright -t pw:local .
    - mkdir -p e2e/playwright-report
    - >
      docker run --rm --network=host
      -e UI_URL=http://docker:8080
      -e MCP_HOST=docker
      -e MCP_PORT=8090
      -e ADMIN_USER=geode
      -e ADMIN_PASSWORD="${GEODE_ADMIN_PASSWORD}"
      -e ADMIN_PROFILE=default
      -v "$PWD/e2e/playwright-report:/work/e2e/playwright-report"
      pw:local
  after_script:
    - make e2e-down || true
  artifacts:
    when: always
    paths:
      - e2e/playwright-report/
    expire_in: 7 days
  # Only run on main and on merge requests touching e2e or backend.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ============================================================================
# RELEASE STAGE - GoReleaser (Go binary + container images + nfpm packages)
# ============================================================================
#
# Two release entry points mirroring the ../geode pipeline:
#
#   • goreleaser-snapshot — runs on every main-branch commit. Builds the
#     binaries + images locally and pushes the GitLab Container Registry
#     tags only. Never touches Docker Hub or the GitLab Release page.
#     allow_failure: true so a flaky goreleaser run doesn't block main.
#
#   • goreleaser-release — runs only on git tags matching v*. Pushes to
#     Docker Hub when DOCKERHUB_USERNAME + DOCKERHUB_TOKEN are set.
#     Hard-blocks on failure.
#
# Both jobs install pinned goreleaser via tarball download (no
# pipe-to-shell), authenticate to registries, then invoke goreleaser.

.goreleaser-base:
  # image-pin: 2026-05-16 @ docker:25 + docker:25-dind; refresh per cadence.
  image: docker:25
  services:
    - docker:25-dind
  # Without `linux` the company-tag also matches the Windows runner
  # (which lacks docker/npm on PATH and would parse the bash heredocs
  # below as PowerShell). The dind service also assumes a Linux host.
  tags:
    - company
    - linux
  variables:
    DOCKER_TLS_CERTDIR: ''
    DOCKER_BUILDKIT: '1'
    GIT_DEPTH: '0'
    # The alpine `go` package ships with GOTOOLCHAIN=local (no
    # auto-download), but our go.mod requires Go 1.26.3 while alpine
    # currently ships Go 1.22.x. `auto` tells Go to download the
    # specific toolchain go.mod asks for. .goreleaser.yaml's
    # builds[].env still pins GOTOOLCHAIN=go1.26.3 for the build
    # process itself; this variable governs the pre-build "loading
    # go mod information" step that runs with the shell env.
    GOTOOLCHAIN: auto
  before_script:
    # Tools: alpine package set + node (for the npm-build before-hook)
    # + go (the goreleaser default builder for the geode-ui binary;
    # without it goreleaser fails at "loading go mod information" with
    # `exec: "go": executable file not found`).
    - apk add --no-cache curl git bash tar xz coreutils jq nodejs npm go
    # Goreleaser binary (pinned, integrity-verifiable via SHA next time).
    - |
      curl -fsSL "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/goreleaser_Linux_x86_64.tar.gz" -o /tmp/gr.tgz
      tar -xzf /tmp/gr.tgz -C /tmp goreleaser
      install -m 0755 /tmp/goreleaser /usr/local/bin/goreleaser
      goreleaser --version
    # Wait for docker daemon
    - |
      for i in $(seq 1 60); do
        if docker info >/dev/null 2>&1; then break; fi
        sleep 1
      done
      docker info
    # GitLab Container Registry login (always available).
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # Optional Docker Hub login. SKIP_DOCKERHUB="true" silences the
    # dockerhub image variants when credentials aren't present.
    - |
      export SKIP_DOCKERHUB=true
      if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
        if echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin; then
          export SKIP_DOCKERHUB=false
          echo "✓ Docker Hub login successful (will push to docker.io/geodedb/geode-ui)"
        else
          echo "⚠ Docker Hub login failed — keeping SKIP_DOCKERHUB=true"
        fi
      fi
      echo "SKIP_DOCKERHUB=$SKIP_DOCKERHUB" > /tmp/dockerhub.env
    # Buildx for multi-arch image assembly.
    - docker buildx create --name multiarch --driver docker-container --use 2>/dev/null || docker buildx use multiarch 2>/dev/null
    - docker buildx inspect --bootstrap
    # NPM dependencies for the SPA build (goreleaser's `before:hooks` runs `npm run build`).
    - npm ci

goreleaser-snapshot:
  extends: .goreleaser-base
  stage: release
  interruptible: false
  needs:
    - job: unit-tests
      artifacts: false
    - job: build
      artifacts: false
    - job: go:test
      artifacts: false
  timeout: 1h
  script:
    - . /tmp/dockerhub.env
    - echo "SKIP_DOCKERHUB=${SKIP_DOCKERHUB}"
    # `--snapshot` skips git-tag validation, marks the build as a snapshot,
    # and short-circuits any release-publish step. Container images are
    # still pushed (snapshot tags carry the `-snapshot-<sha>` suffix).
    - goreleaser release --snapshot --clean --timeout 60m
    - ls -la dist/
  artifacts:
    paths:
      - dist/
    expire_in: 3 days
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null'
  allow_failure: true

goreleaser-release:
  extends: .goreleaser-base
  stage: release
  interruptible: false
  # The validator jobs (unit-tests, go:test) run on MR + default-branch
  # only — they're absent on tag pipelines. `build` DOES run on tags
  # (we use its dist/ artifact). Mark the absent-on-tag deps optional;
  # leave build as a hard dep so we always have the freshly-built SPA.
  needs:
    - job: unit-tests
      artifacts: false
      optional: true
    - job: build
      artifacts: false
    - job: go:test
      artifacts: false
      optional: true
  timeout: 2h
  script:
    - . /tmp/dockerhub.env
    # The single quotes are load-bearing: the `: ` inside the message would
    # otherwise turn the whole line into a YAML mapping (key=`echo "Building
    # release`, value=`...`). See the matching snapshot job above for the
    # bare-form template that's safe because it has no `: `.
    - 'echo "Building release: ${CI_COMMIT_TAG} (SKIP_DOCKERHUB=${SKIP_DOCKERHUB})"'
    - goreleaser release --clean --timeout 120m
    - ls -la dist/
  artifacts:
    paths:
      - dist/
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'

# ============================================================================
# RELEASE STAGE - Electron desktop installers (mac, linux, windows)
# ============================================================================
#
# Three parallel jobs, each producing the platform-specific installer(s)
# defined in electron-builder.yml. All artifacts surface as job artifacts
# and the `release:publish` job below stitches them onto the GitLab
# Release page.
#
# Runner availability (typical company-runner taxonomy):
#   • electron:linux  → linux runner (always available)
#   • electron:mac    → tag `macos`. allow_failure: true so missing
#                       runner doesn't block release; use `when: manual`
#                       fallback if no mac runner is registered.
#   • electron:win    → tag `windows`. Same fallback rule as mac.
#
# Code signing:
#   • mac:  CSC_LINK + CSC_KEY_PASSWORD CI vars (.p12 base64-encoded
#           Developer ID cert). Without these the dmg is unsigned.
#   • win:  WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD for Authenticode.
#   • linux: AppImage + .deb don't require signing for distribution
#           (.deb gpg signing is out of scope; sign the GitLab release
#           tag itself for provenance).

.electron-base:
  stage: release
  interruptible: false
  # unit-tests doesn't run on tag pipelines (its rules exclude tags),
  # so mark optional. build is included because it has $CI_COMMIT_TAG
  # in its rules.
  needs:
    - job: unit-tests
      artifacts: false
      optional: true
    - job: build
      artifacts: false
  timeout: 1h
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'

electron:linux:
  extends: .electron-base
  # image-pin: 2026-05-16 @ NODE_VERSION (top of file) — same cadence
  # as the default top-level image.
  image: node:${NODE_VERSION}
  script:
    - npm ci
    # electron-builder needs a few system libs to package linux artifacts.
    - apt-get update && apt-get install -y --no-install-recommends rpm fakeroot dpkg
    - npm run electron:build
    # Build BOTH AppImage + deb for x64 + arm64 (per electron-builder.yml).
    - npx electron-builder --linux --x64 --arm64 --config electron-builder.yml
    - ls -la release/linux/ || true
  artifacts:
    # Ship the user-facing installers + latest-*.yml manifests only.
    # The `linux-unpacked/` and `linux-arm64-unpacked/` trees are
    # electron-builder build intermediates (~520MB each); including
    # them blew the GitLab 1GB artifact-upload limit (413 Too Large).
    paths:
      - release/linux/*.deb
      - release/linux/*.AppImage
      - release/linux/*.yml
    expire_in: 30 days

electron:mac:
  extends: .electron-base
  tags:
    - macos
  script:
    - npm ci
    - npm run electron:build
    # mac universal dmg. Code signing kicks in if CSC_LINK is set.
    - npx electron-builder --mac --universal --config electron-builder.yml
    - ls -la release/mac/ || true
  artifacts:
    # User-facing installers only — exclude electron-builder's
    # `mac/`/`mac-arm64/` unpacked .app bundles (build intermediates).
    paths:
      - release/mac/*.dmg
      - release/mac/*.zip
      - release/mac/*.yml
    expire_in: 30 days
  # No mac runner registered yet → skip without failing the pipeline.
  # Switch to `allow_failure: false` once a macos runner is available.
  allow_failure: true

electron:win:
  extends: .electron-base
  tags:
    - windows
  script:
    - npm ci
    - npm run electron:build
    - npx electron-builder --win --x64 --config electron-builder.yml
    - dir release\win || echo "no win artifacts"
  artifacts:
    # User-facing installers only — exclude `win-unpacked/`.
    paths:
      - release/win/*.exe
      - release/win/*.msi
      - release/win/*.yml
    expire_in: 30 days
  # Same windows-runner caveat as the mac job.
  allow_failure: true

# ============================================================================
# PUBLISH STAGE - Attach goreleaser + electron artifacts to GitLab Release
# ============================================================================
#
# After goreleaser-release + electron:* finish on a tag, this job:
#   1. Uploads each binary / package / installer to the GitLab Generic
#      Package Registry (permanent URL keyed by version + filename).
#   2. Creates a GitLab Release pointing at those uploads as assets.
#
# We use the GitLab Release API directly instead of `release-cli` so the
# job has full control over asset link names + descriptions.

release:publish:
  stage: publish
  # image-pin: 2026-05-17 @ release-cli v0.24.0 pinned to immutable
  # digest sha256:3f52d526f4...96dacf (resolved via
  # `docker buildx imagetools inspect registry.gitlab.com/gitlab-org/release-cli:v0.24.0`).
  # S-12 (#280) — replaces the prior `:latest` floating tag. Refresh on
  # the same 60d cadence as the rest of the file. QUALITY #233 /
  # scripts/check-image-pins.sh enforces cadence.
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
  needs:
    - job: goreleaser-release
      artifacts: true
    - job: electron:linux
      artifacts: true
      optional: true
    - job: electron:mac
      artifacts: true
      optional: true
    - job: electron:win
      artifacts: true
      optional: true
    # The codesign job re-uploads release/win/*.exe with Authenticode
    # signatures applied in-place. Marked optional so a missing
    # ssl.com cert (or a tag from a fork) still ships unsigned bits.
    - job: codesign:electron-win
      artifacts: true
      optional: true
  before_script:
    - apk add --no-cache curl jq bash coreutils
  script:
    - |
      set -euo pipefail
      VERSION="${CI_COMMIT_TAG#v}"
      PKG_API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/geode-ui/${VERSION}"
      ASSETS_JSON="/tmp/assets.json"
      echo '{"links": []}' > "${ASSETS_JSON}"

      upload() {
        local file="$1"
        local name; name="$(basename "$file")"
        echo "→ uploading ${name}"
        curl --silent --show-error --fail \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${file}" \
          "${PKG_API}/${name}"
        local url="${PKG_API}/${name}"
        jq --arg n "$name" --arg u "$url" \
           '.links += [{"name":$n, "url":$u, "link_type":"package"}]' \
           "${ASSETS_JSON}" > "${ASSETS_JSON}.tmp" && mv "${ASSETS_JSON}.tmp" "${ASSETS_JSON}"
      }

      # GoReleaser outputs (binaries, archives, packages, checksums)
      for f in dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/*.apk dist/checksums.txt; do
        [ -f "$f" ] && upload "$f"
      done

      # Electron installers (each per-OS job published to release/<os>/)
      for f in release/linux/*.AppImage release/linux/*.deb release/mac/*.dmg release/win/*.exe; do
        [ -f "$f" ] && upload "$f"
      done

      cat "${ASSETS_JSON}"
      echo "Asset upload complete."
  release:
    name: Geode UI ${CI_COMMIT_TAG}
    tag_name: ${CI_COMMIT_TAG}
    description: |
      Automated release for ${CI_COMMIT_TAG}.

      ### Container images

      ```
      docker pull ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG#v}
      docker pull docker.io/geodedb/geode-ui:${CI_COMMIT_TAG#v}
      ```

      ### Linux package

      Download the `.deb` / `.rpm` / `.apk` for your platform from the assets below,
      then `dpkg -i geode-ui_${CI_COMMIT_TAG#v}_Linux_x86_64.deb` (or rpm/apk equivalent).

      ### Desktop app

      The `.dmg` (macOS), `.AppImage` + `.deb` (Linux), and `.exe` (Windows) installers
      bundle the Electron desktop client.

      Full release notes generated by GoReleaser are in `dist/CHANGELOG.md`
      attached as a job artifact.
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'

# ============================================================================
# PUBLISH STAGE - apt install smoke test
# ============================================================================
#
# Verifies that the goreleaser-produced .deb can be installed via apt from a
# locally-staged apt repository.  A real apt-repo publishing step (pushing to
# apt.geodedb.com via the apt-publish catalog component + Vault/S3) is a
# follow-up; the prerequisite Vault role and GPG key material have not been
# provisioned for geode-ui yet.  Until that work lands, this job gives the
# same correctness signal by building an unsigned, local-only repository from
# the goreleaser artifacts and running the full `apt install geode-ui` path
# against it.
#
# What is exercised:
#   • dpkg dependency resolution + package control file correctness
#   • preinstall / postinstall scripts execute without error
#   • /usr/bin/geode-ui responds to -h
#   • /etc/geode-ui/geode-ui.conf is installed
#   • /lib/systemd/system/geode-ui.service is installed
#
# Runs on tagged releases only (goreleaser-release produces dist/*.deb).
#
# This is the LOCAL pre-publish sanity check: install the .deb from the
# goreleaser artifact directly via dpkg-path, run the binary, assert the
# unit/conf/seed-file invariants. The downstream `apt-publish` catalog
# component (see include block) pushes the same .deb to
# apt.geodedb.com on every tagged release. A future post-publish
# install-from-live-repo smoke could close the loop but is not
# required — the live publish job's own validation steps (sign,
# repo-build, S3 upload) cover the publish path; this smoke covers
# the install path.
apt-install-smoke:
  stage: publish
  # image-pin: 2026-05-23 @ debian:bookworm — stable Debian release; refresh
  # per the 60d cadence enforced by image-pins-check.
  image: debian:bookworm
  needs:
    - job: goreleaser-release
      artifacts: true
  before_script: []
  script:
    - tests/packaging/apt-install-smoke.sh dist/geode-ui_*_Linux_x86_64.deb
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'

ui-core:typecheck:
  stage: lint
  image: node:${NODE_VERSION}
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/
      - packages/ui-core/node_modules/
  before_script:
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run -w @geodedb/ui-core typecheck
    - npm run -w @geodedb/ui-core test -- --ci
  rules:
    - if: $CI_COMMIT_BRANCH

# ----- Storybook for @geodedb/ui-core -----

build-storybook:
  stage: build
  # image-pin: 2026-05-20 @ NODE_VERSION (top of file) — same cadence as
  # the default top-level image; refresh per image-pins-check cadence.
  image: node:${NODE_VERSION}
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/
      - packages/ui-core/node_modules/
  before_script:
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - NODE_OPTIONS='--max-old-space-size=4096' STORYBOOK_BASE_URL=/storybook/ npm run -w @geodedb/ui-core build-storybook
    - mkdir -p packages/ui-core/storybook-static
  artifacts:
    paths:
      - packages/ui-core/storybook-static/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH
