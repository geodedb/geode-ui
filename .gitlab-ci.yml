---
# GitLab CI/CD Pipeline for ui
# SPDX-License-Identifier: Apache-2.0

include:
  # Standalone secret checks.
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@aad997d40e358eeef7ec943f761498341c37c724

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@aad997d40e358eeef7ec943f761498341c37c724
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@aad997d40e358eeef7ec943f761498341c37c724

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@aad997d40e358eeef7ec943f761498341c37c724

  # Code signing — Windows Authenticode via ssl.com eSigner.
  # Pulls credentials from group-level CI variables ESIGNER_*; see
  # deploy/RELEASE.md for the one-time ssl.com setup.
  #
  # Pinned to an immutable tag (#127, SRE-189); v1.56+ marks this
  # side-effecting signing job `interruptible: false`.
  - component: gitlab.com/devnw/ci-catalog/codesign-windows-ssl@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      input_glob: 'release/win/*.exe'
      needs: 'electron:win'
      tag_only: true
      job_name: 'codesign:electron-win'
      stage: release
      allow_failure: true

variables:
  NODE_VERSION: '24.21.0'
  GO_VERSION: '1.27.3-alpine'
  GORELEASER_VERSION: 'v2.13.3'
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  FF_USE_FASTZIP: 'true'
  ARTIFACT_COMPRESSION_LEVEL: 'fast'
  CACHE_COMPRESSION_LEVEL: 'fast'
  # Docker Hub credentials (set as protected CI variables in GitLab):
  #   DOCKERHUB_USERNAME — Docker Hub login (e.g., "geodedb")
  #   DOCKERHUB_TOKEN    — Docker Hub access token (NOT a password)
  # When unset, goreleaser exports SKIP_DOCKERHUB=true and the dockerhub
  # image variants are built locally but not pushed.

default:
  image: node:${NODE_VERSION}
  before_script:
    # Configure GitLab npm registry for @devnw scope
    - |
      echo "@devnw:registry=https://gitlab.com/api/v4/packages/npm/" >> ~/.npmrc
      echo "//gitlab.com/api/v4/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> ~/.npmrc
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull
  tags:
    - company
    - linux
    # Native artifacts are built for AMD64. Electron's other platforms set
    # their own runner tags.
    - amd64

stages:
  - install
  - lint
  - test
  - build
  - pages
  - security
  - sbom
  - release
  - publish

# ============================================================================
# INSTALL STAGE
# ============================================================================

install:
  interruptible: true
  # node_modules/ is built once by `install` and shipped to these jobs as
  # an artifact, and it carries native bindings for the CPU it was built
  # on (unrs-resolver for jest-resolve, @parcel/watcher, ...). Keep the
  # producer and every consumer on x86: with plain company/linux tags,
  # `install` sometimes ran on the ARM lab runner, and unit-tests on x86
  # then failed with "Preset ts-jest not found" (the arm64 resolver
  # binding cannot load).
  tags: [company, linux, x86]
  stage: install
  script:
    - npm ci
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/
    policy: pull-push
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
  # Jobs without rules default to branch/tag pipelines only, so install
  # was absent from merge-request pipelines while typecheck, eslint,
  # prettier, audit-ratchets, unit-tests and build all `needs` it there,
  # which made every MR pipeline fail at creation. Keep the old
  # branch/tag behaviour and add MR pipelines.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================================================
# LINT STAGE
# ============================================================================

typecheck:
  interruptible: true
  # Same architecture as `install` (see there).
  tags: [company, linux, x86]
  stage: lint
  needs: ['install']
  script:
    - npm run test:ts
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

eslint:
  interruptible: true
  # Same architecture as `install` (see there).
  tags: [company, linux, x86]
  stage: lint
  needs: ['install']
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

prettier:
  interruptible: true
  # Same architecture as `install` (see there).
  tags: [company, linux, x86]
  stage: lint
  needs: ['install']
  script:
    - npm run prettier:check
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Closes GAP-008: the four ratchet gates land in CI alongside the
# existing pre-commit hooks. Local pre-commit + remote CI agree on
# the same enforcement contract, so a contributor who skips the
# pre-commit hook still blocks at MR time.
audit-ratchets:
  interruptible: true
  # Same architecture as `install` (see there).
  tags: [company, linux, x86]
  stage: lint
  needs: ['install']
  script:
    - npm run lint:hardcoded-styles
    - npm run lint:contrast
    - npm run verify:translations
    - npm run detect:hardcoded-strings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Closes GAP-009 / Q25 (#170): type-check the Electron main + preload
# independently from the SPA tsc pass. The renderer tsconfig
# (tsconfig.json) does not include electron/ — without this job, a
# regression in electron/main.ts or electron/preload.ts would land
# silently and only surface during a release-engineer's
# `pnpm electron:package` run. `electron` and `@types/node` are now in
# devDependencies (so `npm run electron:tsc` resolves the `electron`
# module + `node` lib types), the electron sources type-check cleanly,
# and the job is a real gate — no longer allow_failure.
electron-typecheck:
  interruptible: true
  # Same architecture as `install` (see there).
  tags: [company, linux, x86]
  stage: lint
  needs: ['install']
  script:
    - npm run electron:tsc
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - electron/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Supply-chain pin guard (Q32 / #127, SEC F-SUP-3 / #153). The
# pre-commit hook of the same name runs locally; this job mirrors it at
# MR time so a contributor who skipped pre-commit still blocks here.
ci-pins-check:
  interruptible: true
  stage: lint
  needs: []
  image: alpine:3
  before_script: []
  cache: []
  script:
    - apk add --no-cache bash grep
    - bash scripts/check-ci-pins.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Error-code seam guard. The pre-commit hook of the same name runs
# locally; this job mirrors it at MR time so a contributor who skipped
# pre-commit still blocks here if src/api/serverErrorCodes.ts names a
# code that internal/server/errorcodes.go no longer declares.
error-codes-check:
  interruptible: true
  stage: lint
  needs: []
  image: alpine:3
  before_script: []
  cache: []
  script:
    - apk add --no-cache nodejs
    - node --test scripts/check-error-codes.test.mjs
    - node scripts/check-error-codes.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# TEST STAGE
# ============================================================================

unit-tests:
  interruptible: true
  # Same architecture as `install` (see there).
  tags: [company, linux, x86]
  stage: test
  needs: ['install']
  script:
    - npm test -- --coverage --ci
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    paths:
      - coverage/
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================================================
# BUILD STAGE
# ============================================================================

build:
  interruptible: true
  # Required dependencies above also run on tags so release pipelines can start.
  # Same architecture as `install` (see there).
  tags: [company, linux, x86]
  stage: build
  needs:
    - job: install
    - job: eslint
    - job: typecheck
    - job: unit-tests
    - job: audit-ratchets
  variables:
    # The production webpack build needs more than Node's default ~2 GB heap.
    NODE_OPTIONS: --max-old-space-size=4096
  script:
    - npm run build
    - test -s internal/ui/dist/index.html
  artifacts:
    paths:
      - internal/ui/dist/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================================================
# PAGES STAGE - Deploy to GitLab Pages
# ============================================================================

pages:
  interruptible: false
  stage: pages
  needs: ['build']
  before_script: []
  cache: []
  script:
    - test -s internal/ui/dist/index.html
  pages:
    publish: internal/ui/dist
  environment:
    name: production
    url: $CI_PAGES_URL
  rules:
    # A scheduled pipeline (e.g. the weekly extended fuzz, SRE-178) is not a
    # release event: never deploy or push an image from one.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# GO PIPELINE
# ============================================================================
#
# These jobs cover the Go side of the project (backend API server, generated
# code, and the multi-stage Docker image). They reuse the existing
# install/lint/test/build stages declared above.

.go_defaults: &go_defaults
  image: golang:1.27.3-alpine
  variables:
    GOEXPERIMENT: jsonv2
    GOTOOLCHAIN: go1.27.3
    CGO_ENABLED: "0"
  before_script: []
  cache: []

go:lint:
  interruptible: true
  <<: *go_defaults
  stage: lint
  script:
    - apk add --no-cache git make
    # Pinned to an immutable tag (Q32 / #127). Bump deliberately; keep in
    # sync with the version local devs run (see CLAUDE.md / scripts).
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
    # internal/ui embeds the webpack build (//go:embed all:dist). Type-
    # checking only needs the pattern to match, so stub the gitignored
    # dist/ instead of running the full npm build in the lint stage.
    - mkdir -p internal/ui/dist && touch internal/ui/dist/index.html
    - golangci-lint run
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

go:generate-verify:
  interruptible: true
  <<: *go_defaults
  stage: lint
  script:
    - apk add --no-cache make git nodejs npm bash
    - npm ci
    # Pinned to an immutable tag (Q32 / #127). Bump in lockstep with the
    # genapi version the gen/ tree was generated against. NOTE: this pin
    # does not change the fetch auth path — CI's Go jobs run with
    # `before_script: []` and no visible GOPRIVATE/.netrc, so genapi must
    # already be go-gettable by the runner (it was being fetched at
    # @latest before); runner-side module-proxy/auth for devnw.dev/genapi
    # is a separate, pre-existing concern.
    - go install devnw.dev/genapi/cmd/genapi@v0.3.1
    - make generate
    - git diff --exit-code -- gen/ || (echo "make generate produced changes — commit them"; exit 1)
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

go:test:
  interruptible: true
  <<: *go_defaults
  stage: test
  variables:
    GOEXPERIMENT: jsonv2
    GOTOOLCHAIN: go1.27.3
    # -race needs cgo (and a C toolchain); the shared defaults disable it
    # for static builds.
    CGO_ENABLED: "1"
  script:
    - apk add --no-cache git make nodejs npm gcc musl-dev
    - npm ci
    - npm run build
    # Project-owned trees only, so ./... does not walk into
    # node_modules/flatted/golang/.
    - go test -race -cover -failfast ./cmd/... ./gen/... ./internal/...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Native Go fuzzing with an explicit cadence (SRE-178). The generated fuzz
# targets carry `//go:build fuzz`, so discovery and runs use -tags=fuzz.
# Every Fuzz target `go test -list` finds in the project-owned trees
# (gen/pkg/mcpx FuzzJSONRPC and gen/pkg/wsx FuzzWSFrame today) is fuzzed:
#   extended  the weekly schedule (infra/org devnw-governance,
#             gitlab_go_extended_fuzz.tf, which sets GO_FUZZ_MODE=extended) or a
#             "Run pipeline" (web): FUZZ_EXTENDED_TIME per target.
#   short     merge requests that touch Go code, fuzz corpora or this file:
#             FUZZ_SHORT_TIME iterations per target, a bounded repeatable gate.
# Default-branch pushes and tags do not fuzz. A failing target does not stop
# the others: each result goes to out/fuzz-summary.txt, and new failing inputs
# are kept under testdata/fuzz so they can be committed as seeds.
# GO_FUZZ_MODE and GO_FUZZ_TIME override the mode and budget for one run.
go:fuzz:
  <<: *go_defaults
  stage: test
  needs: []
  timeout: 1h
  variables:
    GOEXPERIMENT: jsonv2
    GOTOOLCHAIN: go1.27.3
    CGO_ENABLED: "0"
    FUZZ_SHORT_TIME: "200x"
    FUZZ_EXTENDED_TIME: "10m"
  script:
    - apk add --no-cache git
    # internal/ui embeds the webpack build (//go:embed all:dist); compiling
    # its tests only needs the pattern to match (same stub as go:lint).
    - mkdir -p internal/ui/dist && touch internal/ui/dist/index.html
    - |
      case "${GO_FUZZ_MODE:-}" in
        short|extended) mode="$GO_FUZZ_MODE" ;;
        *) if [ "$CI_PIPELINE_SOURCE" = "web" ]; then mode=extended; else mode=short; fi ;;
      esac
      if [ "$mode" = extended ]; then budget="${GO_FUZZ_TIME:-$FUZZ_EXTENDED_TIME}"; else budget="${GO_FUZZ_TIME:-$FUZZ_SHORT_TIME}"; fi
      echo "fuzz mode=${mode} fuzztime=${budget} (source=${CI_PIPELINE_SOURCE})"
      mkdir -p out
      : > out/fuzz-summary.txt
      targets=0
      failed=0
      # Only packages whose tracked test files declare a Fuzz function need
      # `go test -list` (each call compiles that package's tests); tracked
      # files only, so node_modules is never searched.
      dirs=$(git ls-files '*_test.go' | xargs -r grep -lE '^func Fuzz' | xargs -r -n1 dirname | sort -u)
      for pkg in $(for d in $dirs; do go list "./$d"; done); do
        # A test-compile error must fail the job, not silently list nothing.
        listing=$(go test -tags=fuzz -list '^Fuzz' "$pkg")
        for fn in $(printf '%s\n' "$listing" | grep '^Fuzz' || true); do
          targets=$((targets + 1))
          echo "=== fuzz ${pkg} ${fn} (${budget})"
          if go test -tags=fuzz -run "^${fn}\$" -fuzz "^${fn}\$" -fuzztime "$budget" "$pkg"; then
            echo "PASS ${pkg} ${fn} ${budget}" >> out/fuzz-summary.txt
          else
            echo "FAIL ${pkg} ${fn} ${budget}" >> out/fuzz-summary.txt
            failed=$((failed + 1))
          fi
        done
      done
      echo "fuzz targets: ${targets}, failed: ${failed} (${mode})" | tee -a out/fuzz-summary.txt
      cat out/fuzz-summary.txt
      [ "$targets" -gt 0 ] && [ "$failed" -eq 0 ]
  artifacts:
    when: always
    paths:
      - out/fuzz-summary.txt
      - cmd/**/testdata/fuzz/
      - gen/**/testdata/fuzz/
      - internal/**/testdata/fuzz/
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $GO_FUZZ_MODE == "extended"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - '**/*.go'
        - '**/testdata/fuzz/**/*'
        - go.mod
        - go.sum
        - .gitlab-ci.yml

# Performance regression gate (PERF-2026-05-11-11 / #156).
#
# Runs `make bench-gate`, which executes the curated benchmark set
# (scripts/bench-gate.sh — internal/conn, internal/server, internal/jwt,
# gen/pkg/{wsx,oidcx,securex,gen}) with `-count=6` and a bounded `-benchtime`,
# then diffs the result against the committed `bench-baseline.txt` via
# `benchstat`. The job fails if any benchmark regressed > 10% in ns/op, B/op,
# or allocs/op with a statistically significant delta.
#
# `allow_failure: true` on purpose: shared CI runners are noisy. The high
# -count + benchstat's significance test suppress most false positives, but
# not all — treat a red gate as "go investigate", not "you broke prod". After
# a deliberate, accepted perf change, regenerate the baseline with
# `make bench-baseline` and commit `bench-baseline.txt`. See docs/ARCHITECTURE.md
# ("Performance SLOs"). Promote to `allow_failure: false` once runner noise is
# characterised on real telemetry.
bench-gate:
  interruptible: true
  <<: *go_defaults
  stage: test
  needs: ['go:test']
  script:
    - apk add --no-cache git make bash
    # Pinned to an immutable pseudo-version (Q32 / #127); x/perf has no
    # semver tags, so this is the latest tagged commit of cmd/benchstat.
    - go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260409210113-8e83ce0f7b1c
    - export PATH="$(go env GOPATH)/bin:$PATH"
    - make bench-gate
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Builds the multi-stage Dockerfile in deploy/. The Dockerfile's build
# context is the parent of geode-ui/ (see deploy/Dockerfile header), so CI
# copies the checkout into a temporary parent dir.
docker:build:
  interruptible: false
  stage: build
  image: docker:29
  services:
    - docker:29-dind
  before_script: []
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    # The group-level DOCKER_AUTH_CONFIG CI/CD variable holds a *read_registry*
    # deploy token (so runners can pull registry.gitlab.com/security-products/*
    # analyzer images). The docker CLI reads it from the environment and it
    # TAKES PRECEDENCE over `docker login`, so `docker push` to
    # registry.gitlab.com fails with `insufficient_scope: authorization
    # failed`. Unset it and log in with the push-capable CI job token.
    - unset DOCKER_AUTH_CONFIG
    - apk add --no-cache git
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - mkdir -p /tmp/ctx/geode-ui
    - cp -r . /tmp/ctx/geode-ui/
    - cd /tmp/ctx
    - docker build -f geode-ui/deploy/Dockerfile -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA; fi
  rules:
    # A scheduled pipeline (e.g. the weekly extended fuzz, SRE-178) is not a
    # release event: never deploy or push an image from one.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================================================
# E2E STAGE - Playwright suite against the full docker-compose stack
# ============================================================================
#
# Runs the e2e Playwright suite against the docker-compose.test.yml stack.
# The geode engine image extends the published Geode release image, pinned
# by digest in deploy/geode/Dockerfile.geode, so no geode build is needed.
e2e:playwright:
  interruptible: true
  stage: test
  image: docker:29
  # Stack build (~7 min) + seeding + ~106 specs on a contended shared VM
  # ran past the 1 h project default (job 17097098422).
  timeout: 2h
  # x86 only: the Geode release image the stack runs is amd64-only, and the
  # ARM lab runner (which also carries company/linux) has no reachable dind
  # daemon ("Cannot connect to the Docker daemon at tcp://docker:2375").
  tags: [company, linux, x86]
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    GEODE_ADMIN_PASSWORD: "Geode E2E Bootstrap Password 2024"
    JWT_SECRET_HEX: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" # pragma: allowlist secret
    COMPOSE_PROJECT_NAME: "geode-ui-${CI_PROJECT_ID}-${CI_JOB_ID}"
    COMPOSE_FILES: "-f deploy/docker-compose.test.yml -f deploy/docker-compose.ci.yml"
  script:
    - apk add --no-cache make git bash curl
    # The dind service can still be starting when the script begins.
    - |
      for i in $(seq 1 60); do
        if docker info >/dev/null 2>&1; then break; fi
        sleep 1
      done
      docker info >/dev/null
    # Build the e2e stack and bring services up.
    - make e2e-up
    # Build the playwright runner and run the suite. Copy reports back through
    # the Docker API: the daemon may not share this job's checkout paths.
    # Playwright's global setup owns the bounded health wait. Browser and
    # services communicate on this job's network without publishing ports.
    - docker build -f deploy/playwright/Dockerfile.playwright -t "${COMPOSE_PROJECT_NAME}-playwright:e2e" .
    - mkdir -p e2e/playwright-report
    - |
      container_id="$(docker create --network="${COMPOSE_PROJECT_NAME}_default" \
        -e UI_URL=http://geode-ui:8080 \
        -e MCP_HOST=geode-mcp \
        -e MCP_PORT=8090 \
        -e ADMIN_USER=geode \
        -e ADMIN_PASSWORD="${GEODE_ADMIN_PASSWORD}" \
        -e ADMIN_PROFILE=default \
        "${COMPOSE_PROJECT_NAME}-playwright:e2e")"
      printf '%s\n' "$container_id" > .e2e-playwright-container
      docker start --attach "$container_id"
  after_script:
    - |
      if [ -s .e2e-playwright-container ]; then
        container_id="$(cat .e2e-playwright-container)"
        mkdir -p e2e/playwright-report
        docker cp "$container_id:/work/e2e/playwright-report/." e2e/playwright-report/ || true
        docker rm --force "$container_id" || true
        rm -f .e2e-playwright-container
      fi
    # Keep the engine and server logs (and every other service's) so a
    # failed run can be diagnosed after the stack is gone.
    - mkdir -p e2e/compose-logs
    - docker compose $COMPOSE_FILES ps -a > e2e/compose-logs/ps.txt 2>&1 || true
    - docker compose $COMPOSE_FILES logs --no-color --timestamps geode > e2e/compose-logs/geode.log 2>&1 || true
    - docker compose $COMPOSE_FILES logs --no-color --timestamps geode-ui > e2e/compose-logs/geode-ui.log 2>&1 || true
    - docker compose $COMPOSE_FILES logs --no-color --timestamps > e2e/compose-logs/all.log 2>&1 || true
    - make e2e-down || true
    - docker image rm "${COMPOSE_PROJECT_NAME}-playwright:e2e" "${COMPOSE_PROJECT_NAME}-ui:e2e" "${COMPOSE_PROJECT_NAME}-geode:e2e" || true
  artifacts:
    when: always
    paths:
      - e2e/playwright-report/
      - e2e/compose-logs/
    expire_in: 7 days
  # Only run on main and on merge requests touching e2e or backend.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ============================================================================
# SECURITY STAGE - gitleaks (component job override)
# ============================================================================

# Scan the full history. With the default shallow fetch (depth 20) gitleaks
# attributes every line in the tree to the oldest fetched commit, so the
# fingerprints in .gitleaksignore change with each new commit and reviewed
# historic false positives come back. A full clone makes the attribution
# stable and also scans more history, not less.
security-gitleaks:
  variables:
    GIT_DEPTH: '0'

# ============================================================================
# RELEASE STAGE - GoReleaser (Go binary + container images + nfpm packages)
# ============================================================================
#
# Two release entry points mirroring the ../geode pipeline:
#
#   • goreleaser:snapshot — runs on every main-branch commit. Builds the
#     binaries + images without publishing them.
#     allow_failure: true so a flaky goreleaser run doesn't block main.
#
#   • goreleaser:release — runs only on git tags matching v*. Pushes to
#     Docker Hub when DOCKERHUB_USERNAME + DOCKERHUB_TOKEN are set.
#     Hard-blocks on failure.
#
# Both jobs install pinned goreleaser via tarball download (no
# pipe-to-shell), authenticate to registries, then invoke goreleaser.

.goreleaser-base:
  image: golang:${GO_VERSION}
  services:
    - docker:29-dind
  tags:
    - company
    - linux
    - x86
  cache: []
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    DOCKER_BUILDKIT: '1'
    GIT_DEPTH: '0'
    GORELEASER_FORCE_TOKEN: gitlab
  before_script:
    # The build job supplies the SPA; GoReleaser only compiles/packages it.
    - apk add --no-cache curl git bash tar xz coreutils jq docker-cli docker-cli-buildx
    - go version
    - test -s internal/ui/dist/index.html
    # Goreleaser binary (pinned, integrity-verifiable via SHA next time).
    - |
      curl -fsSL "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/goreleaser_Linux_x86_64.tar.gz" -o /tmp/gr.tgz
      tar -xzf /tmp/gr.tgz -C /tmp goreleaser
      install -m 0755 /tmp/goreleaser /usr/local/bin/goreleaser
      goreleaser --version
    # Wait for docker daemon
    - |
      for i in $(seq 1 60); do
        if docker info >/dev/null 2>&1; then break; fi
        sleep 1
      done
      docker info
    # GitLab Container Registry login (always available).
    #
    # The group-level DOCKER_AUTH_CONFIG CI/CD variable holds a *read_registry*
    # deploy token (so runners can pull registry.gitlab.com/security-products/*
    # analyzer images). The docker CLI reads it from the environment and it
    # TAKES PRECEDENCE over `docker login` — so every push to
    # registry.gitlab.com (goreleaser `dockers:`/`docker_manifests:`) fails with
    # `insufficient_scope: authorization failed`. Unset it here so the push
    # below uses the push-capable CI job token from `docker login`.
    - unset DOCKER_AUTH_CONFIG
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # Optional Docker Hub login. SKIP_DOCKERHUB="true" silences the
    # dockerhub image variants when credentials aren't present.
    - |
      export SKIP_DOCKERHUB=true
      if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
        if echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin; then
          export SKIP_DOCKERHUB=false
          echo "✓ Docker Hub login successful (will push to docker.io/geodedb/geode-ui)"
        else
          echo "⚠ Docker Hub login failed — keeping SKIP_DOCKERHUB=true"
        fi
      fi
      echo "SKIP_DOCKERHUB=$SKIP_DOCKERHUB" > /tmp/dockerhub.env
    # Buildx for multi-arch image assembly.
    - docker buildx create --name multiarch --driver docker-container --use 2>/dev/null || docker buildx use multiarch 2>/dev/null
    - docker buildx inspect --bootstrap

goreleaser:snapshot:
  extends: .goreleaser-base
  stage: release
  interruptible: false
  needs:
    - job: unit-tests
      artifacts: false
    - job: build
      artifacts: true
    - job: go:test
      artifacts: false
  timeout: 1h
  script:
    - . /tmp/dockerhub.env
    - echo "SKIP_DOCKERHUB=${SKIP_DOCKERHUB}"
    # `--snapshot` skips git-tag validation, marks the build as a snapshot,
    # and skips publication, including container image pushes.
    - goreleaser release --snapshot --clean --skip=before --timeout 60m
    - ls -la dist/
  artifacts:
    paths:
      - dist/
    expire_in: 3 days
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null'
  allow_failure: true

goreleaser:release:
  extends: .goreleaser-base
  stage: release
  interruptible: false
  needs:
    - job: unit-tests
      artifacts: false
    - job: build
      artifacts: true
    - job: go:test
      artifacts: false
  timeout: 2h
  script:
    - . /tmp/dockerhub.env
    - 'echo "Building release: ${CI_COMMIT_TAG} (SKIP_DOCKERHUB=${SKIP_DOCKERHUB})"'
    - goreleaser release --clean --skip=before --timeout 120m
    - ls -la dist/
  artifacts:
    paths:
      - dist/
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'

# ============================================================================
# RELEASE STAGE - Electron desktop installers (mac, linux, windows)
# ============================================================================
#
# Three parallel jobs, each producing the platform-specific installer(s)
# defined in electron-builder.yml. All artifacts surface as job artifacts
# and the `release:publish` job below stitches them onto the GitLab
# Release page.
#
# Runner availability (typical company-runner taxonomy):
#   • electron:linux  → linux runner (always available)
#   • electron:mac    → tag `macos`. allow_failure: true so missing
#                       runner doesn't block release; use `when: manual`
#                       fallback if no mac runner is registered.
#   • electron:win    → tag `windows`. Same fallback rule as mac.
#
# Code signing:
#   • mac:  CSC_LINK + CSC_KEY_PASSWORD CI vars (.p12 base64-encoded
#           Developer ID cert). Without these the dmg is unsigned.
#   • win:  WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD for Authenticode.
#   • linux: AppImage + .deb don't require signing for distribution
#           (.deb gpg signing is out of scope; sign the GitLab release
#           tag itself for provenance).

.electron-base:
  stage: release
  interruptible: false
  needs:
    - job: unit-tests
      artifacts: false
    - job: build
      artifacts: false
  timeout: 1h
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'

electron:linux:
  extends: .electron-base
  image: node:${NODE_VERSION}
  script:
    - npm ci
    # electron-builder needs a few system libs to package linux artifacts.
    - apt-get update && apt-get install -y --no-install-recommends rpm fakeroot dpkg
    - npm run electron:build
    # Build BOTH AppImage + deb for x64 + arm64 (per electron-builder.yml).
    - npx electron-builder --linux --x64 --arm64 --config electron-builder.yml
    - ls -la release/linux/ || true
  artifacts:
    paths:
      - release/linux/
    expire_in: 30 days

electron:mac:
  extends: .electron-base
  tags:
    - macos
  script:
    - npm ci
    - npm run electron:build
    # mac universal dmg. Code signing kicks in if CSC_LINK is set.
    - npx electron-builder --mac --universal --config electron-builder.yml
    - ls -la release/mac/ || true
  artifacts:
    paths:
      - release/mac/
    expire_in: 30 days
  # No mac runner registered yet → skip without failing the pipeline.
  # Switch to `allow_failure: false` once a macos runner is available.
  allow_failure: true

electron:win:
  extends: .electron-base
  tags:
    - windows
  script:
    - npm ci
    - npm run electron:build
    - npx electron-builder --win --x64 --config electron-builder.yml
    - dir release\win || echo "no win artifacts"
  artifacts:
    paths:
      - release/win/
    expire_in: 30 days
  # Same windows-runner caveat as the mac job.
  allow_failure: true

# ============================================================================
# PUBLISH STAGE - Attach goreleaser + electron artifacts to GitLab Release
# ============================================================================
#
# After goreleaser:release + electron:* finish on a tag, this job:
#   1. Uploads each binary / package / installer to the GitLab Generic
#      Package Registry (permanent URL keyed by version + filename).
#   2. Creates a GitLab Release pointing at those uploads as assets.
#
# We use the GitLab Release API directly instead of `release-cli` so the
# job has full control over asset link names + descriptions.

release:publish:
  interruptible: false
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: goreleaser:release
      artifacts: true
    - job: electron:linux
      artifacts: true
      optional: true
    - job: electron:mac
      artifacts: true
      optional: true
    - job: electron:win
      artifacts: true
      optional: true
    # The codesign job re-uploads release/win/*.exe with Authenticode
    # signatures applied in-place. Marked optional so a missing
    # ssl.com cert (or a tag from a fork) still ships unsigned bits.
    - job: codesign:electron-win
      artifacts: true
      optional: true
  before_script:
    - apk add --no-cache curl jq bash coreutils
  script:
    - |
      set -euo pipefail
      VERSION="${CI_COMMIT_TAG#v}"
      PKG_API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/geode-ui/${VERSION}"
      ASSETS_JSON="/tmp/assets.json"
      echo '{"links": []}' > "${ASSETS_JSON}"

      upload() {
        local file="$1"
        local name; name="$(basename "$file")"
        echo "→ uploading ${name}"
        curl --silent --show-error --fail \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${file}" \
          "${PKG_API}/${name}"
        local url="${PKG_API}/${name}"
        jq --arg n "$name" --arg u "$url" \
           '.links += [{"name":$n, "url":$u, "link_type":"package"}]' \
           "${ASSETS_JSON}" > "${ASSETS_JSON}.tmp" && mv "${ASSETS_JSON}.tmp" "${ASSETS_JSON}"
      }

      # GoReleaser outputs (binaries, archives, packages, checksums)
      for f in dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/*.apk dist/checksums.txt; do
        [ -f "$f" ] && upload "$f"
      done

      # Electron installers (each per-OS job published to release/<os>/)
      for f in release/linux/*.AppImage release/linux/*.deb release/mac/*.dmg release/win/*.exe; do
        [ -f "$f" ] && upload "$f"
      done

      cat "${ASSETS_JSON}"
      echo "Asset upload complete."
  release:
    name: Geode UI ${CI_COMMIT_TAG}
    tag_name: ${CI_COMMIT_TAG}
    description: |
      Automated release for ${CI_COMMIT_TAG}.

      ### Container images

      ```
      docker pull ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG#v}
      docker pull docker.io/geodedb/geode-ui:${CI_COMMIT_TAG#v}
      ```

      ### Linux package

      Download the `.deb` / `.rpm` / `.apk` for your platform from the assets below,
      then `dpkg -i geode-ui_${CI_COMMIT_TAG#v}_Linux_x86_64.deb` (or rpm/apk equivalent).

      ### Desktop app

      The `.dmg` (macOS), `.AppImage` + `.deb` (Linux), and `.exe` (Windows) installers
      bundle the Electron desktop client.

      Full release notes generated by GoReleaser are in `dist/CHANGELOG.md`
      attached as a job artifact.
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'

workflow:
  # SRE-172: a newer commit on the same ref cancels the superseded pipeline's
  # interruptible (validation) jobs. Release/deploy jobs stay non-interruptible.
  auto_cancel:
    on_new_commit: interruptible
  # An open MR owns push validation; other pipeline sources stay admitted.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - when: always
