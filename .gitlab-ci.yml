---
# GitLab CI/CD Pipeline for ui
# SPDX-License-Identifier: Apache-2.0

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.7.1

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.7.1

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.7.1

variables:
  NODE_VERSION: '22.14.0'
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  FF_USE_FASTZIP: 'true'
  ARTIFACT_COMPRESSION_LEVEL: 'fast'
  CACHE_COMPRESSION_LEVEL: 'fast'

default:
  image: node:${NODE_VERSION}
  before_script:
    # Configure GitLab npm registry for @devnw scope
    - |
      echo "@devnw:registry=https://gitlab.com/api/v4/packages/npm/" >> ~/.npmrc
      echo "//gitlab.com/api/v4/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> ~/.npmrc
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull
  tags:
    - company

stages:
  - install
  - lint
  - test
  - build
  - pages
  - security
  - sbom
  - release

# ============================================================================
# INSTALL STAGE
# ============================================================================

install:
  stage: install
  script:
    - npm ci
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/
    policy: pull-push
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# ============================================================================
# LINT STAGE
# ============================================================================

typecheck:
  stage: lint
  needs: ['install']
  script:
    - npm run test:ts
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

eslint:
  stage: lint
  needs: ['install']
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

prettier:
  stage: lint
  needs: ['install']
  script:
    - npm run prettier:check
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Closes GAP-008: the four ratchet gates land in CI alongside the
# existing pre-commit hooks. Local pre-commit + remote CI agree on
# the same enforcement contract, so a contributor who skips the
# pre-commit hook still blocks at MR time.
audit-ratchets:
  stage: lint
  needs: ['install']
  script:
    - npm run lint:hardcoded-styles
    - npm run lint:contrast
    - npm run verify:translations
    - npm run detect:hardcoded-strings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Closes GAP-009: type-check the Electron main + preload independently
# from the SPA tsc pass. The renderer tsconfig (tsconfig.json) does
# not include electron/ — without this job, a regression in
# electron/main.ts or electron/preload.ts would land silently and
# only surface during a release-engineer's `pnpm electron:package`
# run. The job is allow_failure for now because @types/node and
# electron itself are not yet pulled into devDependencies; flip to
# strict once the release pipeline goes live.
electron-typecheck:
  stage: lint
  needs: ['install']
  script:
    - npm run electron:tsc
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - electron/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# TEST STAGE
# ============================================================================

unit-tests:
  stage: test
  needs: ['install']
  script:
    - npm test -- --coverage --ci
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    paths:
      - coverage/
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# BUILD STAGE
# ============================================================================

build:
  stage: build
  needs:
    - job: install
    - job: eslint
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================================================
# PAGES STAGE - Deploy to GitLab Pages
# ============================================================================

pages:
  stage: pages
  needs: ['build']
  before_script: []
  script:
    - mv dist public
  artifacts:
    paths:
      - public
  environment:
    name: production
    url: $CI_PAGES_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# GO PIPELINE
# ============================================================================
#
# These jobs cover the Go side of the project (backend API server, generated
# code, and the multi-stage Docker image). They reuse the existing
# install/lint/test/build stages declared above.

.go_defaults: &go_defaults
  image: golang:1.26-alpine
  variables:
    GOEXPERIMENT: jsonv2
    GOTOOLCHAIN: go1.26.2
    CGO_ENABLED: "0"
  before_script: []
  cache: []

go:lint:
  <<: *go_defaults
  stage: lint
  script:
    - apk add --no-cache git make
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
    - golangci-lint run
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

go:generate-verify:
  <<: *go_defaults
  stage: lint
  script:
    - apk add --no-cache make git nodejs npm
    - npm ci
    - go install devnw.dev/genapi/cmd/genapi@latest
    - make generate
    - git diff --exit-code -- gen/ || (echo "make generate produced changes — commit them"; exit 1)
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

go:test:
  <<: *go_defaults
  stage: test
  script:
    - apk add --no-cache git make nodejs npm
    - npm ci
    - npm run build
    - go test -race -cover -failfast ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Builds the multi-stage Dockerfile in deploy/. The Dockerfile expects a
# sibling geode-client-go/ checkout next to the geode-ui/ context root (see
# deploy/Dockerfile header). For CI, fetch the sibling repo into a temporary
# parent dir so docker build sees the expected layout.
docker:build:
  stage: build
  image: docker:25
  services:
    - docker:25-dind
  before_script: []
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - apk add --no-cache git
    - mkdir -p /tmp/ctx/geode-ui
    - cp -r . /tmp/ctx/geode-ui/
    - git clone --depth=1 https://gitlab.com/devnw/geode/geode-client-go.git /tmp/ctx/geode-client-go || echo "geode-client-go clone failed; document a private mirror token if needed"
    - cd /tmp/ctx
    - docker build -f geode-ui/deploy/Dockerfile -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA; fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================================================
# E2E STAGE - Playwright suite against the full docker-compose stack
# ============================================================================
#
# Runs the e2e Playwright suite against the docker-compose.test.yml stack.
# The stack expects a pre-built geode binary at ../geode/zig-out/bin/geode
# (see deploy/geode/Dockerfile.geode). In CI we clone the geode repo at the
# pinned tag and run `zig build` before invoking `make e2e-up`. This requires
# Zig 0.16.0+ on the runner (installed inline below). If the geode repo
# becomes inaccessible from CI, switch this job to `when: manual` and rely
# on local `make e2e-ci` runs until the geode runtime ships as a binary
# release artifact.
e2e:playwright:
  stage: test
  image: docker:25
  services:
    - docker:25-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    GEODE_ADMIN_PASSWORD: "Geode E2E Bootstrap Password 2024"
    JWT_SECRET_HEX: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" # pragma: allowlist secret
    ZIG_VERSION: "0.16.0"
  script:
    - apk add --no-cache make git bash curl xz tar
    # Install Zig so the geode binary can be built on the host.
    - curl -sSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
    - mkdir -p /opt/zig && tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
    - export PATH="/opt/zig:$PATH"
    - zig version
    # Fetch the geode runtime sources at the pinned tag and build the binary.
    - git clone --depth=1 --branch v0.5.11 https://gitlab.com/devnw/codepros/geode/geode.git ../geode || git clone --depth=1 --branch v0.5.11 https://gitlab.com/devnw/geode/geode.git ../geode
    - (cd ../geode && zig build -Doptimize=ReleaseSafe)
    # Build the e2e stack and bring services up.
    - make e2e-up
    # Wait for geode-ui to be ready.
    - |
      for i in $(seq 1 90); do
        if wget -qO- http://docker:8080/healthz 2>/dev/null | grep -q ok; then
          echo "geode-ui is healthy"
          break
        fi
        sleep 2
      done
    # Build the playwright runner and run the suite. Mount the report dir.
    - docker build -f deploy/playwright/Dockerfile.playwright -t pw:local .
    - mkdir -p e2e/playwright-report
    - >
      docker run --rm --network=host
      -e UI_URL=http://docker:8080
      -e MCP_HOST=docker
      -e MCP_PORT=8090
      -e ADMIN_USER=geode
      -e ADMIN_PASSWORD="${GEODE_ADMIN_PASSWORD}"
      -e ADMIN_PROFILE=default
      -v "$PWD/e2e/playwright-report:/work/e2e/playwright-report"
      pw:local
  after_script:
    - make e2e-down || true
  artifacts:
    when: always
    paths:
      - e2e/playwright-report/
    expire_in: 7 days
  # Only run on main and on merge requests touching e2e or backend.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
