# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json
# https://pre-commit.com
#
# Combined Go + React pipeline modeled on:
#   ~/src/devnw/go/msft (Go discipline: detect-secrets baseline, checkmake,
#       commitizen-branch on pre-push, single make-target uber-hook)
#   ~/src/devnw/codepros/brancher/brancher (mixed-stack layered hooks:
#       fast pre-commit checks + heavy pre-push gauntlet)
#
# pre-commit stage: file hygiene, formatters, fast linters
# pre-push stage:   typecheck, full test suites, build verifications, generate-verify

default_stages: [pre-commit]
fail_fast: false

repos:
  # ── Standard file hygiene ──────────────────────────────────────────────
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    exclude: ^(\.gitlab/|gen/|.*\.svg$)
  - id: end-of-file-fixer
    exclude: ^(\.gitlab/|gen/|.*\.svg$)
  - id: mixed-line-ending
    args: [--fix=lf]
    exclude: ^gen/
  - id: check-yaml
    args: [--allow-multiple-documents, --unsafe]
  - id: check-json
    exclude: ^gen/
  - id: check-toml
  - id: detect-private-key
  - id: check-added-large-files
    args: [--maxkb=1024]
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: check-symlinks
  - id: destroyed-symlinks
  - id: check-executables-have-shebangs
  - id: check-shebang-scripts-are-executable

  # ── Shell linting ──────────────────────────────────────────────────────
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
  - id: shellcheck
    args: [--severity=error]

  # ── Secrets ────────────────────────────────────────────────────────────
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    name: detect secrets
    args:
    - --baseline
    - .secrets.baseline
    - --exclude-files
    - (^gen/|^node_modules/|^package-lock\.json$|^\.secrets\.baseline$|_test\.go$)

  # ── Makefile lint ──────────────────────────────────────────────────────
- repo: https://github.com/mrtazz/checkmake.git
  rev: 0.2.2
  hooks:
  - id: checkmake

  # ── Markdown linting ───────────────────────────────────────────────────
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.43.0
  hooks:
  - id: markdownlint
    args: [--config, .markdownlint.json]
    exclude: ^(CHANGELOG\.md|docs/superpowers/plans/.*|gen/.*)$

  # ── YAML formatting ────────────────────────────────────────────────────
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.14.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
    exclude: ^(\.gitlab-ci\.yml|gen/.*)$

  # ── Conventional commits ───────────────────────────────────────────────
- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.12.1
  hooks:
  - id: commitizen
    stages: [commit-msg]
  - id: commitizen-branch
    stages: [pre-push]

  # ── geode-ui local hooks (Go + React) ──────────────────────────────────
- repo: local
  hooks:
      # ── pre-commit (fast: formatters + per-file linters) ───────────────
  - id: gofmt-check
    name: gofmt
    entry: scripts/check-gofmt.sh
    language: system
    pass_filenames: false
    files: \.go$
    exclude: ^gen/

  - id: go-vet
    name: go vet
    entry: scripts/run-go.sh vet ./...
    language: system
    pass_filenames: false
    files: \.go$
    exclude: ^gen/

  - id: eslint
    name: eslint
    entry: npx --no-install eslint --max-warnings=0
    language: system
    files: \.(ts|tsx)$
    exclude: ^(node_modules/|gen/|electron/|internal/ui/electron-dist/)

  - id: prettier-check
    name: prettier:check
    entry: npm run prettier:check --silent
    language: system
    pass_filenames: false
    files: \.(ts|tsx|json|css)$
    exclude: ^(node_modules/|gen/|electron/|package-lock\.json)

  # Theme enforcement — lightweight scans that fail loudly if a hex
  # literal or rgb()/hsl() call shows up outside src/theme/, or if any
  # text/bg pair in the theme drops below WCAG AA contrast.
  - id: lint-hardcoded-styles
    name: lint:hardcoded-styles
    entry: node scripts/check-hardcoded-styles.mjs
    language: system
    pass_filenames: false
    files: \.(ts|tsx|css)$
    exclude: ^(node_modules/|gen/)

  - id: lint-contrast
    name: lint:contrast
    entry: node scripts/check-contrast.mjs
    language: system
    pass_filenames: false
    files: ^(src/theme/|scripts/check-contrast\.mjs)

  # i18n enforcement.
  #   verify-translations: every `t('foo')` referenced in source must
  #     resolve in every required locale (default: en). Orphan keys
  #     in the locale are tolerated up to --max-warnings-total to ease
  #     adoption.
  #   detect-hardcoded-strings: surfaces JSX label / placeholder /
  #     aria-label literals that should funnel through `t()`. Runs in
  #     warn mode (exit 0) until the codebase is fully migrated; flip
  #     to --strict in a follow-up commit.
  - id: verify-translations
    name: verify:translations
    entry: npm run verify:translations --silent
    language: system
    pass_filenames: false
    files: \.(ts|tsx)$
    exclude: ^(node_modules/|gen/|electron/)

  - id: detect-hardcoded-strings
    name: detect:hardcoded-strings
    entry: node scripts/detect-hardcoded-strings.mjs
    language: system
    pass_filenames: false
    files: \.tsx$
    exclude: ^(node_modules/|gen/|electron/)
    verbose: true

      # ── pre-push (heavy: typecheck + tests + build verifications) ──────
  - id: golangci-lint
    name: golangci-lint
    entry: scripts/run-go.sh tool-golangci
    language: system
    pass_filenames: false
    stages: [pre-push]

  - id: go-mod-tidy
    name: go mod tidy (no diff)
    entry: scripts/check-go-mod-tidy.sh
    language: system
    pass_filenames: false
    stages: [pre-push]

  - id: ts-typecheck
    name: tsc --noEmit
    entry: npm run test:ts --silent
    language: system
    pass_filenames: false
    stages: [pre-push]

  - id: go-test
    name: go test -race
    entry: scripts/run-go.sh test -race -cover -failfast ./...
    language: system
    pass_filenames: false
    stages: [pre-push]

  - id: js-test
    name: jest --ci
    entry: bash -c 'npm test -- --ci'
    language: system
    pass_filenames: false
    stages: [pre-push]

  - id: generate-verify
    name: make generate (no diff)
    entry: scripts/check-generate.sh
    language: system
    pass_filenames: false
    stages: [pre-push]

  - id: web-build
    name: webpack production build
    entry: bash -c 'npm run build --silent'
    language: system
    pass_filenames: false
    stages: [pre-push]

  - id: go-build
    name: go build ./...
    entry: scripts/run-go.sh build ./...
    language: system
    pass_filenames: false
    stages: [pre-push]

ci:
  autofix_prs: true
  autofix_commit_msg: '[pre-commit.ci] auto fixes'
  autoupdate_schedule: weekly
  # CI runs its own pipeline (.gitlab-ci.yml); skip local hooks there.
  skip:
  - gofmt-check
  - go-vet
  - eslint
  - prettier-check
  - lint-hardcoded-styles
  - lint-contrast
  - verify-translations
  - detect-hardcoded-strings
  - golangci-lint
  - go-mod-tidy
  - ts-typecheck
  - go-test
  - js-test
  - generate-verify
  - web-build
  - go-build
