# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json
# https://pre-commit.com
#
# Combined Go + React pipeline modeled on:
#   ~/src/devnw/go/msft (Go discipline: detect-secrets baseline, checkmake,
#       commitizen-branch on pre-push, single make-target uber-hook)
#   ~/src/devnw/codepros/brancher/brancher (mixed-stack layered hooks:
#       fast pre-commit checks + heavy pre-push gauntlet)
#
# pre-commit stage: file hygiene, formatters, fast linters
# pre-push stage:   typecheck, full test suites, build verifications, generate-verify

default_stages: [pre-commit]
fail_fast: false

repos:
  # ── Standard file hygiene ──────────────────────────────────────────────
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    exclude: ^(\.gitlab/|gen/|.*\.svg$)
  - id: end-of-file-fixer
    exclude: ^(\.gitlab/|gen/|.*\.svg$)
  - id: mixed-line-ending
    args: [--fix=lf]
    exclude: ^gen/
  - id: check-yaml
    args: [--allow-multiple-documents, --unsafe]
  - id: check-json
    exclude: ^gen/
  - id: check-toml
  - id: detect-private-key
  - id: check-added-large-files
    args: [--maxkb=1024]
    # Generated multi-statement Geode seed files routinely cross the
    # 1024-KB hygiene cap (vulndb.gql ~424 KB stayed under; social.gql
    # ~6.8 MB does not). They're machine-emitted from deploy/geode/
    # seed/*.py with deterministic PRNG seeds, so the size is a
    # function of the bake-in fixture count rather than something to
    # vet at commit time. Exempt the GQL seeds to keep the gate
    # meaningful for human-authored artefacts.
    exclude: ^deploy/geode/.*\.gql$
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: check-symlinks
  - id: destroyed-symlinks
  - id: check-executables-have-shebangs
  - id: check-shebang-scripts-are-executable

  # ── Shell linting ──────────────────────────────────────────────────────
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
  - id: shellcheck
    args: [--severity=error]

  # ── Secrets ────────────────────────────────────────────────────────────
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    name: detect secrets
    args:
    - --baseline
    - .secrets.baseline
    - --exclude-files
    - (^gen/|^node_modules/|^package-lock\.json$|^\.secrets\.baseline$|_test\.go$|^docs/superpowers/plans/.*\.md$|^docs/bug-fixes/.*\.md$|^docs/audits/.*\.md$)

  # ── Makefile lint ──────────────────────────────────────────────────────
- repo: https://github.com/mrtazz/checkmake.git
  rev: 0.2.2
  hooks:
  - id: checkmake

  # ── Markdown linting ───────────────────────────────────────────────────
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.43.0
  hooks:
  - id: markdownlint
    args: [--config, .markdownlint.json]
    exclude: ^(CHANGELOG\.md|docs/superpowers/plans/.*|docs/audits/.*|docs/bug-fixes/.*|docs/upstream-issues/.*|gen/.*)$

  # ── YAML formatting ────────────────────────────────────────────────────
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.14.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
    exclude: ^(\.gitlab-ci\.yml|gen/.*)$

  # ── Conventional commits ───────────────────────────────────────────────
- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.12.1
  hooks:
  - id: commitizen
    stages: [commit-msg]
  - id: commitizen-branch
    stages: [pre-push]

  # ── geode-ui local hooks (Go + React) ──────────────────────────────────
- repo: local
  hooks:
      # ── pre-commit (fast: formatters + per-file linters) ───────────────
      # Supply-chain pin guard (Q32 / #127, SEC F-SUP-3 / #153, Q rank 17 /
      # #230): fails if any `go install ...@latest` line or ci-catalog
      # `component:` ref in .gitlab-ci.yml or scripts/bench-gate.sh is
      # unpinned. Cheap; runs only when either file moves.
  - id: check-ci-pins
    name: check-ci-pins
    entry: scripts/check-ci-pins.sh .gitlab-ci.yml scripts/bench-gate.sh
    language: system
    pass_filenames: false
    files: ^(\.gitlab-ci\.yml|scripts/bench-gate\.sh)$

      # Error-code seam guard: every server error code the SPA branches on
      # (exported from src/api/serverErrorCodes.ts) must still exist as an
      # ErrCode* constant in internal/server/errorcodes.go. Catches silent
      # drift between the two sides. Cheap; runs only when either file moves.
  - id: check-error-codes
    name: error-code seam vs errorcodes.go
    entry: node scripts/check-error-codes.mjs
    language: system
    pass_filenames: false
    files: ^(internal/server/errorcodes\.go|src/api/serverErrorCodes\.ts)$

      # Go toolchain version guard (QUALITY-rank-1 / #148, SEC
      # GO-2026-4918 / #212): every place the Go toolchain is pinned
      # (go.mod, .goreleaser.yaml, Makefile, .gitlab-ci.yml, README.md)
      # must agree on the single source of truth declared in
      # scripts/check-go-toolchain.sh. Catches the drift that left
      # release/docs paths routing through Go 1.26.2 long after the
      # 1.26.3 CVE fix shipped.
  - id: check-go-toolchain
    name: check-go-toolchain
    entry: scripts/check-go-toolchain.sh
    language: system
    pass_filenames: false
    files: ^(go\.mod|\.goreleaser\.yaml|Makefile|\.gitlab-ci\.yml|README\.md|scripts/check-go-toolchain\.sh)$

  - id: gofmt-check
    name: gofmt
    entry: scripts/check-gofmt.sh
    language: system
    pass_filenames: false
    files: \.go$
    exclude: ^gen/

  - id: go-vet
    name: go vet
    entry: scripts/run-go.sh vet ./...
    language: system
    pass_filenames: false
    files: \.go$
    exclude: ^gen/

  - id: eslint
    name: eslint
    entry: npx --no-install eslint --max-warnings=0
    language: system
    files: \.(ts|tsx)$
    exclude: ^(node_modules/|gen/|electron/|internal/ui/electron-dist/)

  - id: prettier-check
    name: prettier:check
    entry: npm run prettier:check --silent
    language: system
    pass_filenames: false
    files: \.(ts|tsx|json|css)$
    exclude: ^(node_modules/|gen/|electron/|package-lock\.json)

  # Theme enforcement — lightweight scans that fail loudly if a hex
  # literal or rgb()/hsl() call shows up outside src/theme/, or if any
  # text/bg pair in the theme drops below WCAG AA contrast.
  - id: lint-hardcoded-styles
    name: lint:hardcoded-styles
    entry: node scripts/check-hardcoded-styles.mjs
    language: system
    pass_filenames: false
    files: \.(ts|tsx|css)$
    exclude: ^(node_modules/|gen/)

  - id: lint-contrast
    name: lint:contrast
    entry: node scripts/check-contrast.mjs
    language: system
    pass_filenames: false
    files: ^(src/theme/|scripts/check-contrast\.mjs)

  # i18n enforcement.
  #   verify-translations: every `t('foo')` referenced in source must
  #     resolve in every required locale (default: en). Orphan keys
  #     in the locale are tolerated up to --max-warnings-total to ease
  #     adoption.
  #   detect-hardcoded-strings: surfaces JSX label / placeholder /
  #     aria-label literals that should funnel through `t()`. Runs in
  #     warn mode (exit 0) until the codebase is fully migrated; flip
  #     to --strict in a follow-up commit.
  - id: verify-translations
    name: verify:translations
    entry: npm run verify:translations --silent
    language: system
    pass_filenames: false
    files: \.(ts|tsx)$
    exclude: ^(node_modules/|gen/|electron/)

  - id: detect-hardcoded-strings
    name: detect:hardcoded-strings
    entry: node scripts/detect-hardcoded-strings.mjs --strict
    language: system
    pass_filenames: false
    files: \.(ts|tsx)$
    exclude: ^(node_modules/|gen/|electron/)

  # Q-NEW-2 / S-NEW-3: ban JSX HTML renderers so the i18n module's
  # escapeValue: false setting can't become an XSS vector. See
  # docs/I18N.md for the full rationale.
  - id: check-html-renderers
    name: check:html-renderers
    entry: node scripts/check-html-renderers.mjs
    language: system
    pass_filenames: false
    files: \.(ts|tsx)$
    exclude: ^(node_modules/|gen/|electron/)

      # QUAL #253: workspace doc residue gate. The /workspace route +
      # WorkspacePage component were deleted; live docs must not
      # resurrect those references. Historical surfaces (resolved
      # gap log, superseded plans, gap-tracking columns) are
      # allow-listed inside the script.
  - id: check-doc-routes
    name: check:doc-routes
    entry: node scripts/check-doc-routes.mjs
    language: system
    pass_filenames: false
    files: \.md$

      # QUAL #258: CHANGELOG.md must keep an `## [Unreleased]` heading
      # and reference each backfilled closure-batch date so future
      # contributors can't silently let the file drift again. New
      # cohort dates get added to REQUIRED_BATCH_DATES in the script.
  - id: check-changelog
    name: check:changelog
    entry: node scripts/check-changelog.mjs
    language: system
    pass_filenames: false
    files: ^CHANGELOG\.md$
    always_run: true

      # SEC #322/#323: docker-compose.test.yml must not embed hardcoded
      # secret defaults — operator-misuse on copy-to-prod would yield
      # forgeable HS256 JWTs (#323) and cleartext-equivalent profile
      # encryption (#322). The gate also pins the `${VAR:?msg}` required
      # form so `:-` doesn't sneak back in via a future "fix".
  - id: check-compose-secrets
    name: check:compose-secrets
    entry: node scripts/check-compose-secrets.mjs
    language: system
    pass_filenames: false
    files: ^deploy/docker-compose\.test\.yml$
    always_run: true

      # GAP-047: refuse mac-only keyboard glyphs (⌘ / ⌥ / ⇧ / ⌃) outside
      # the single src/lib/platformKeyHints.ts seam. Hotkey hints must
      # funnel through modKeyLabel() / shiftKeyLabel() so Linux / Windows
      # users see "Ctrl" / "Shift" instead of foreign symbols.
  - id: check-no-mac-glyphs
    name: check:no-mac-glyphs
    entry: node scripts/check-no-mac-glyphs.mjs
    language: system
    pass_filenames: false
    files: ^src/(services/i18n/locales|components|pages|lib)/.*\.tsx?$
    always_run: true

      # ── pre-push (heavy: typecheck + tests + build verifications) ──────
      # QUALITY #174: explicit GO_PKGS list so neither golangci-lint nor
      # go test walks `node_modules/flatted/golang/`. Mirrors the
      # `Makefile:16` GO_PKGS variable and the .gitlab-ci.yml override.
  - id: golangci-lint
    name: golangci-lint
    entry: scripts/run-go.sh tool-golangci ./cmd/... ./gen/... ./internal/...
    language: system
    pass_filenames: false
    stages: [pre-push]

  - id: go-mod-tidy
    name: go mod tidy (no diff)
    entry: scripts/check-go-mod-tidy.sh
    language: system
    pass_filenames: false
    stages: [pre-push]

  - id: ts-typecheck
    name: tsc --noEmit
    entry: npm run test:ts --silent
    language: system
    pass_filenames: false
    stages: [pre-push]

  - id: go-test
    name: go test -race
    entry: scripts/run-go.sh test -race -cover -failfast ./cmd/... ./gen/... ./internal/...
    language: system
    pass_filenames: false
    stages: [pre-push]

  - id: js-test
    name: jest --ci
    entry: bash -c 'npm test -- --ci'
    language: system
    pass_filenames: false
    stages: [pre-push]

  - id: generate-verify
    name: make generate (no diff)
    entry: scripts/check-generate.sh
    language: system
    pass_filenames: false
    stages: [pre-push]

  - id: web-build
    name: webpack production build
    entry: bash -c 'npm run build --silent'
    language: system
    pass_filenames: false
    stages: [pre-push]

  - id: go-build
    name: go build ./...
    entry: scripts/run-go.sh build ./...
    language: system
    pass_filenames: false
    stages: [pre-push]

ci:
  autofix_prs: true
  autofix_commit_msg: '[pre-commit.ci] auto fixes'
  autoupdate_schedule: weekly
  # CI runs its own pipeline (.gitlab-ci.yml); skip local hooks there.
  skip:
  - gofmt-check
  - go-vet
  - eslint
  - prettier-check
  - lint-hardcoded-styles
  - lint-contrast
  - verify-translations
  - detect-hardcoded-strings
  - check-html-renderers
  - check-doc-routes
  - check-changelog
  - check-compose-secrets
  - check-no-mac-glyphs
  - golangci-lint
  - go-mod-tidy
  - ts-typecheck
  - go-test
  - js-test
  - generate-verify
  - web-build
  - go-build
