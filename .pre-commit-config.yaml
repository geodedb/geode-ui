# Pre-commit configuration
# https://pre-commit.com/

default_stages: [pre-commit]
fail_fast: false

repos:
  # Standard pre-commit hooks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: trailing-whitespace
    exclude: ^\.gitlab/
  - id: end-of-file-fixer
    exclude: ^\.gitlab/
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: check-yaml
    args: [--unsafe]
  - id: check-json
  - id: check-toml
  - id: check-added-large-files
    args: [--maxkb=1024]
  - id: check-merge-conflict
  - id: detect-private-key

  # Shell linting
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.10.0.1
  hooks:
  - id: shellcheck
    args: [--severity=error]

  # Markdown linting
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.43.0
  hooks:
  - id: markdownlint
    args: [--config, .markdownlint.json]
    exclude: ^(CHANGELOG\.md|docs/superpowers/plans/.*|gen/.*)$

  # YAML formatting
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.14.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
    exclude: ^(\.gitlab-ci\.yml|gen/.*)$

  # Conventional commits
- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.1.0
  hooks:
  - id: commitizen
    stages: [commit-msg]

  # Local hooks
- repo: local
  hooks:
  - id: eslint
    name: eslint
    entry: npx --no-install eslint --max-warnings=0
    language: system
    files: \.(ts|tsx)$
    exclude: ^(node_modules/|gen/)

  - id: typecheck
    name: typescript check
    entry: npx tsc --noEmit
    language: system
    pass_filenames: false
    files: \.(ts|tsx)$
    stages: [pre-push]

  - id: check-todos
    name: check TODOs
    entry: |-
      bash -c 'if grep -rn "TODO\|FIXME\|HACK\|XXX" src/ --include="*.ts" --include="*.tsx" 2>/dev/null; then echo "Warning: Found TODO/FIXME markers"; fi; exit 0'
    language: system
    pass_filenames: false
    verbose: true

ci:
  autofix_prs: true
  autofix_commit_msg: '[pre-commit.ci] auto fixes'
  autoupdate_schedule: weekly
  skip: [eslint, typecheck]
