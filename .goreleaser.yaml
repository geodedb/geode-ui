# GoReleaser config for the geode-ui Go server binary + container images.
#
# Layout mirrors ../geode/.goreleaser.yaml so operators get the same release
# muscle memory across the two repos:
#
#   - Cross-compile a single static Go binary per linux/{amd64,arm64} +
#     darwin/{amd64,arm64} target.
#   - Bundle the SPA assets into the binary via //go:embed before the Go
#     compile step (the npm build runs in `before:hooks`).
#   - Build 4 docker images: debian + alpine, each in amd64 + arm64; push to
#     both GitLab Container Registry (CI_REGISTRY_IMAGE) and Docker Hub
#     (geodedb/geode-ui), with multi-arch manifest tags.
#   - Produce nfpm packages (.deb, .rpm, .apk) so operators can `apt install
#     geode-ui` from a downloaded deb.
#   - GitLab Release publishing is owned by .gitlab-ci.yml's release-semantic
#     component (release: section here is `disable: true`).
#
# Electron desktop installers are NOT built by goreleaser — they live in
# parallel CI jobs (electron-mac/linux/windows) that invoke
# electron-builder. The release-publish job in .gitlab-ci.yml collects
# both sets of artifacts onto the same GitLab Release page.
version: 2

project_name: geode-ui

before:
  hooks:
    # Build the SPA so internal/ui/dist/* is populated before `go build`
    # runs the //go:embed pass. CI seeds node_modules via the install
    # job; locally, the engineer should `npm ci` first.
    #
    # PERF #235: EMBEDDED_BUILD=1 disables webpack source-map emission
    # so the //go:embed all:dist directive does NOT pull 48.78 MiB of
    # *.map files into the release binary. Dev builds (no env var) keep
    # source-map for devtools-driven debugging.
    #
    # Goreleaser v2.13.3's nFPM-compatible YAML schema expects each
    # hooks entry as a string, NOT the `{cmd, env}` map form (the map
    # shape produces `yaml: unmarshal errors: cannot unmarshal !!map
    # into string` at parse time). Pre-pend the env var inline via
    # `sh -c` to preserve the EMBEDDED_BUILD=1 semantics without the
    # map syntax.
  - sh -c "EMBEDDED_BUILD=1 npm run build"

builds:
- id: geode-ui
  main: ./cmd/server
  binary: geode-ui
  env:
  - CGO_ENABLED=0
  - GOEXPERIMENT=jsonv2
  - GOTOOLCHAIN=go1.26.3
  goos:
  - linux
  - darwin
  goarch:
  - amd64
  - arm64
  flags:
  - -trimpath
  ldflags:
  - -s -w
  - -X main.version={{ .Version }}
  - -X main.commit={{ .FullCommit }}
  - -X main.date={{ .Date }}

# =============================================================================
# Archives - per-platform binary distribution
# =============================================================================

archives:
- id: geode-ui-archives
  ids:
  - geode-ui
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
  format_overrides:
  - goos: windows
    formats: [zip]
  files:
  - README.md
  - LICENSE
  - docs/I18N.md
  - docs/ELECTRON.md
  - deploy/profiles.json

# =============================================================================
# Checksums + snapshots
# =============================================================================

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}'

changelog:
  sort: asc
  use: git
  groups:
  - title: Breaking Changes
    regexp: ^.*!:.*$
    order: 0
  - title: Features
    regexp: ^.*feat(\(.+\))?:.*$
    order: 1
  - title: Bug Fixes
    regexp: ^.*fix(\(.+\))?:.*$
    order: 2
  - title: Security
    regexp: ^.*sec(\(.+\))?:.*$
    order: 3
  - title: Performance
    regexp: ^.*perf(\(.+\))?:.*$
    order: 4
  - title: Documentation
    regexp: ^.*docs(\(.+\))?:.*$
    order: 5
  - title: Other
    order: 999
  filters:
    exclude:
    - '^chore:'
    - '^style:'
    - '^test\(e2e\):'
    - Merge pull request
    - Merge branch

# =============================================================================
# Docker Images - 4 variants × 2 registries
# =============================================================================
# CI requirements:
#   • GitLab: $CI_REGISTRY_IMAGE is auto-populated; CI_JOB_TOKEN authenticates.
#   • Docker Hub: DOCKERHUB_USERNAME + DOCKERHUB_TOKEN CI variables.
#     SKIP_DOCKERHUB=true (set in CI when login fails) bypasses the push.
#
# Each image is single-arch; the docker_manifests section below stitches them
# into multi-arch tags.

dockers:
  # --- Debian images: GitLab Registry ---
- id: geode-ui-debian-amd64
  ids:
  - geode-ui
  goos: linux
  goarch: amd64
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-amd64'
  dockerfile: deploy/Dockerfile.release
  use: buildx
  build_flag_templates:
  - --pull
  - --platform=linux/amd64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}
  - --label=org.opencontainers.image.source={{.GitURL}}
  - --label=org.opencontainers.image.description=Geode UI - admin web UI for the Geode graph database
  - --label=org.opencontainers.image.licenses=Apache-2.0

- id: geode-ui-debian-arm64
  ids:
  - geode-ui
  goos: linux
  goarch: arm64
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-arm64'
  dockerfile: deploy/Dockerfile.release
  use: buildx
  build_flag_templates:
  - --pull
  - --platform=linux/arm64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}
  - --label=org.opencontainers.image.source={{.GitURL}}
  - --label=org.opencontainers.image.description=Geode UI - admin web UI for the Geode graph database
  - --label=org.opencontainers.image.licenses=Apache-2.0

  # --- Alpine images: GitLab Registry ---
- id: geode-ui-alpine-amd64
  ids:
  - geode-ui
  goos: linux
  goarch: amd64
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-amd64'
  dockerfile: deploy/Dockerfile.release.alpine
  use: buildx
  build_flag_templates:
  - --pull
  - --platform=linux/amd64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}-alpine
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}
  - --label=org.opencontainers.image.licenses=Apache-2.0

- id: geode-ui-alpine-arm64
  ids:
  - geode-ui
  goos: linux
  goarch: arm64
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-arm64'
  dockerfile: deploy/Dockerfile.release.alpine
  use: buildx
  build_flag_templates:
  - --pull
  - --platform=linux/arm64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}-alpine
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}
  - --label=org.opencontainers.image.licenses=Apache-2.0

  # --- Debian images: Docker Hub (skipped on snapshot or when SKIP_DOCKERHUB=true) ---
- id: geode-ui-dockerhub-debian-amd64
  ids:
  - geode-ui
  goos: linux
  goarch: amd64
  image_templates:
  - docker.io/geodedb/geode-ui:{{ .Version }}-amd64
  dockerfile: deploy/Dockerfile.release
  use: buildx
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'
  build_flag_templates:
  - --pull
  - --platform=linux/amd64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}
  - --label=org.opencontainers.image.source=https://gitlab.com/devnw/codepros/geode/geode-ui
  - --label=org.opencontainers.image.description=Geode UI - admin web UI for the Geode graph database
  - --label=org.opencontainers.image.licenses=Apache-2.0

- id: geode-ui-dockerhub-debian-arm64
  ids:
  - geode-ui
  goos: linux
  goarch: arm64
  image_templates:
  - docker.io/geodedb/geode-ui:{{ .Version }}-arm64
  dockerfile: deploy/Dockerfile.release
  use: buildx
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'
  build_flag_templates:
  - --pull
  - --platform=linux/arm64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}
  - --label=org.opencontainers.image.source=https://gitlab.com/devnw/codepros/geode/geode-ui
  - --label=org.opencontainers.image.licenses=Apache-2.0

  # --- Alpine images: Docker Hub ---
- id: geode-ui-dockerhub-alpine-amd64
  ids:
  - geode-ui
  goos: linux
  goarch: amd64
  image_templates:
  - docker.io/geodedb/geode-ui:{{ .Version }}-alpine-amd64
  dockerfile: deploy/Dockerfile.release.alpine
  use: buildx
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'
  build_flag_templates:
  - --pull
  - --platform=linux/amd64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}-alpine
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}
  - --label=org.opencontainers.image.licenses=Apache-2.0

- id: geode-ui-dockerhub-alpine-arm64
  ids:
  - geode-ui
  goos: linux
  goarch: arm64
  image_templates:
  - docker.io/geodedb/geode-ui:{{ .Version }}-alpine-arm64
  dockerfile: deploy/Dockerfile.release.alpine
  use: buildx
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'
  build_flag_templates:
  - --pull
  - --platform=linux/arm64
  - --label=org.opencontainers.image.created={{.Date}}
  - --label=org.opencontainers.image.title={{.ProjectName}}-alpine
  - --label=org.opencontainers.image.revision={{.FullCommit}}
  - --label=org.opencontainers.image.version={{.Version}}
  - --label=org.opencontainers.image.licenses=Apache-2.0

# =============================================================================
# Multi-arch manifest lists - same shape as ../geode
# =============================================================================

docker_manifests:
  # GitLab Registry: debian
- name_template: '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}'
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-amd64'
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-arm64'

- name_template: '{{ .Env.CI_REGISTRY_IMAGE }}:latest'
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-amd64'
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-arm64'

- name_template: '{{ .Env.CI_REGISTRY_IMAGE }}:v{{ .Major }}.{{ .Minor }}'
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-amd64'
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-arm64'

- name_template: '{{ .Env.CI_REGISTRY_IMAGE }}:v{{ .Major }}'
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-amd64'
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-arm64'

  # GitLab Registry: alpine
- name_template: '{{ .Env.CI_REGISTRY_IMAGE }}:alpine'
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-amd64'
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-arm64'

- name_template: '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine'
  image_templates:
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-amd64'
  - '{{ .Env.CI_REGISTRY_IMAGE }}:{{ .Version }}-alpine-arm64'

  # Docker Hub: debian
- name_template: docker.io/geodedb/geode-ui:{{ .Version }}
  image_templates:
  - docker.io/geodedb/geode-ui:{{ .Version }}-amd64
  - docker.io/geodedb/geode-ui:{{ .Version }}-arm64
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'

- name_template: docker.io/geodedb/geode-ui:latest
  image_templates:
  - docker.io/geodedb/geode-ui:{{ .Version }}-amd64
  - docker.io/geodedb/geode-ui:{{ .Version }}-arm64
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'

- name_template: docker.io/geodedb/geode-ui:v{{ .Major }}.{{ .Minor }}
  image_templates:
  - docker.io/geodedb/geode-ui:{{ .Version }}-amd64
  - docker.io/geodedb/geode-ui:{{ .Version }}-arm64
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'

- name_template: docker.io/geodedb/geode-ui:v{{ .Major }}
  image_templates:
  - docker.io/geodedb/geode-ui:{{ .Version }}-amd64
  - docker.io/geodedb/geode-ui:{{ .Version }}-arm64
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'

  # Docker Hub: alpine
- name_template: docker.io/geodedb/geode-ui:alpine
  image_templates:
  - docker.io/geodedb/geode-ui:{{ .Version }}-alpine-amd64
  - docker.io/geodedb/geode-ui:{{ .Version }}-alpine-arm64
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'

- name_template: docker.io/geodedb/geode-ui:{{ .Version }}-alpine
  image_templates:
  - docker.io/geodedb/geode-ui:{{ .Version }}-alpine-amd64
  - docker.io/geodedb/geode-ui:{{ .Version }}-alpine-arm64
  skip_push: '{{ if or .IsSnapshot (eq .Env.SKIP_DOCKERHUB "true") }}true{{ end }}'

# =============================================================================
# System packages (deb/rpm/apk) via nFPM
# =============================================================================

nfpms:
- id: geode-ui-packages
  package_name: geode-ui
  ids:
  - geode-ui
  vendor: CodePros
  homepage: https://gitlab.com/devnw/codepros/geode/geode-ui
  maintainer: Geode Team <geode@codepros.dev>
  description: |-
    Geode UI - admin web interface for the Geode graph database.

    Self-hosted Go binary serving a React SPA + JSON+WS API. Pairs with
    the Geode graph database (geodedb.com). When installed on a host
    that also carries the `geode` package, the postinstall seeds a
    `local-geode` profile pointing at quic://localhost:3141.
  license: Apache-2.0
  formats:
  - deb
  - rpm
  - apk
  bindir: /usr/bin
  section: database
  priority: optional
  provides:
  - geode-ui
  dependencies:
  - ca-certificates
  # Soft-suggest the geode server. apt installs both with one
  # command (`apt install geode geode-ui`) but does not pull geode
  # in implicitly.
  recommends:
  - geode
  file_name_template: >-
    {{ .ProjectName }}_{{ .Version }}_
    {{- if eq .Os "linux" }}Linux{{- else }}{{ title .Os }}{{ end }}_
    {{- if eq .Arch "amd64" }}x86_64
    {{- else if eq .Arch "arm64" }}arm64
    {{- else }}{{ .Arch }}{{ end }}
  scripts:
    preinstall: scripts/packaging/preinstall.sh
    postinstall: scripts/packaging/postinstall.sh
    preremove: scripts/packaging/preremove.sh
    postremove: scripts/packaging/postremove.sh
  contents:
    # Docs
  - src: README.md
    dst: /usr/share/doc/geode-ui/README.md
    file_info: {mode: 0644}
  - src: LICENSE
    dst: /usr/share/doc/geode-ui/LICENSE
    file_info: {mode: 0644}
  - src: docs/INSTALL.md
    dst: /usr/share/doc/geode-ui/INSTALL.md
    file_info: {mode: 0644}

    # systemd unit
  - src: deployment/systemd/geode-ui.service
    dst: /lib/systemd/system/geode-ui.service
    file_info: {mode: 0644}

    # EnvironmentFile + seed dir (config|noreplace so operator edits
    # survive upgrades).
  - src: deployment/config/geode-ui.conf
    dst: /etc/geode-ui/geode-ui.conf
    type: config|noreplace
    file_info: {mode: 0644}
  - src: deployment/seed-profiles.d/README.md
    dst: /etc/geode-ui/seed-profiles.d/README.md
    file_info: {mode: 0644}

    # detect-local-geode.sh (sourced from postinstall via the
    # canonical /usr/share path so it survives a chroot postinstall).
  - src: scripts/packaging/detect-local-geode.sh
    dst: /usr/share/geode-ui/packaging/detect-local-geode.sh
    file_info: {mode: 0755}

    # Config dirs only — these contain shipped files (geode-ui.conf,
    # seed-profiles.d/README.md), so dpkg keeps them on `apt remove`
    # and only wipes them on `apt purge` after the conffiles are
    # cleared.
  - dst: /etc/geode-ui
    type: dir
    file_info: {mode: 0750}
  - dst: /etc/geode-ui/seed-profiles.d
    type: dir
    file_info: {mode: 0750}

    # NOTE on /var/lib/geode-ui and /var/log/geode-ui:
    # These are operator-data dirs (sqlite profile store, uploads,
    # logs) created by `postinstall.sh` rather than shipped in the
    # package. dpkg removes any *empty* package-owned dir on
    # `apt remove`; the smoke test runs the binary with
    # `-profile-store=:memory:`, so the data dir stays empty and
    # would be wiped on a non-purge remove — failing the "data
    # survives apt remove" invariant. Postinstall mkdir + chown
    # keeps them off dpkg's directory ledger, so they only get
    # removed when postremove handles the `purge` action.

  deb:
    compression: xz
  rpm:
    compression: xz

# =============================================================================
# Release publishing - delegated to .gitlab-ci.yml's release-semantic component
# =============================================================================

release:
  disable: true

# =============================================================================
# Metadata
# =============================================================================

metadata:
  mod_timestamp: '{{ .CommitTimestamp }}'

announce:
  skip: true
