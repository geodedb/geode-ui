# electron-builder config — drives `npm run electron:package`.
#
# The packaged app bundles the compiled main process (electron-dist/main.js
# + preload.js) plus the SPA build (internal/ui/dist) under app:// custom
# protocol. CI invokes this config from per-OS jobs (electron-mac,
# electron-linux, electron-windows) in .gitlab-ci.yml; each job uploads
# the resulting installers as job artifacts, and the publish-release
# job stitches them onto the GitLab Release page.
#
# Code signing:
#   • mac:  set CSC_LINK + CSC_KEY_PASSWORD CI vars (Apple Developer ID
#           cert in .p12). Without them the build still produces an
#           unsigned .dmg suitable for internal testing.
#   • win:  set WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD for Authenticode.
#   • linux: AppImage + deb need no signing (.deb is signed via gpg
#           separately if desired — out of scope here).

appId: com.geodedb.ui
productName: Geode UI Desktop
copyright: Copyright (c) Geode Database. All rights reserved.

directories:
  output: release/${platform}
  buildResources: build

files:
- internal/ui/electron-dist/**/*
- internal/ui/dist/**/*
- package.json

# Asar packs everything into a single archive. Off by default so debugging
# packaged builds is easier; turn on once main + preload are stable.
# asar: true

mac:
  category: public.app-category.developer-tools
  target:
  - target: dmg
    arch: [universal]
  hardenedRuntime: true
  gatekeeperAssess: false
  # Provide an icon at build/icon.icns before publishing — placeholder
  # falls back to electron's default during local builds.
  # icon: build/icon.icns

linux:
  target:
  - target: AppImage
    arch: [x64, arm64]
  - target: deb
    arch: [x64, arm64]
  category: Development
  artifactName: geode-ui-desktop_${version}_${arch}.${ext}
  executableName: geode-ui-desktop

win:
  target:
  - target: nsis
    arch: [x64]
  # icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

deb:
  # Avoid the "geode" name collision with the upstream graph-database
  # apt package. The package name is the artifactName base; depends
  # stays empty because the desktop app talks to any reachable geode-
  # ui origin, not necessarily a locally-installed one.
  packageName: geode-ui-desktop
  # `xz` compression on the outer .deb wrapper (vs the default gzip).
  # Marginal additional savings on a .deb whose bulk is already-
  # compressed chromium binaries (~5-10%), but every megabyte counts:
  # the apt-publish catalog roundtrips `apt-repo/` as a GitLab job
  # artifact bounded by the 1GB runner upload limit (catalog v1.25.2
  # template `templates/apt-publish/template.yml:515-519`). Pairs with
  # the `apt-repo-apt-geodedb-com.after_script` trim in `.gitlab-ci.yml`
  # which drops the historical S3-pool snapshot from the artifact so
  # only THIS release's .debs round-trip — the historical .debs stay
  # on S3 and are referenced by the freshly-generated `Packages`.
  compression: xz
  depends: []
  # Recommend the headless service so apt suggests "install both for
  # the all-on-one-host experience" without forcing it.
  recommends:
  - geode-ui
  # Block the pre-rename electron .deb (was published locally only;
  # never reached apt). The historic package was named `geode` at
  # version 0.1.x. The graph DB `geode` package (sibling repo at
  # gitlab.com/devnw/codepros/geode/geode) is currently at v0.5.19+,
  # well past 0.2 — so this Conflicts entry blocks ONLY the historic
  # electron stub without blocking the intended co-resident-with-DB
  # install. electron-builder 26.x does not expose a native `conflicts:`
  # key; pass the flag through fpm (the underlying packager tool).
  fpm:
  - --conflicts
  - geode (<< 0.2)

# Publishing config. CI does NOT use electron-builder's --publish flag;
# instead, the per-OS jobs upload `release/**/*.{dmg,AppImage,deb,exe}`
# as GitLab job artifacts, and the publish-release job in
# .gitlab-ci.yml uploads them to the GitLab Generic Package Registry
# and links them on the GitLab Release page.
#
# Setting `provider: generic` here documents the contract for future
# third-party auto-update deployments (where the app would fetch
# update manifests from a hosted feed). Until that lands the field is
# inert — `electron-builder build` (no --publish) does not contact it.
publish:
  provider: generic
  url: https://gitlab.com/devnw/codepros/geode/geode-ui/-/releases/${version}/downloads
